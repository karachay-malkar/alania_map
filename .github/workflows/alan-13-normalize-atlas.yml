name: Diagnose Alan Map 13 atlas chunks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout 13.0 branch
        uses: actions/checkout@v4
        with:
          ref: agent/13-0-north-down-morphology-atlas
          fetch-depth: 0

      - name: Diagnose Base64 chunk boundaries
        shell: python
        run: |
          import base64, binascii, json, re
          from pathlib import Path
          manifest=json.loads(Path('data/mountains/mountain-icon-manifest-13.0.json').read_text(encoding='utf-8'))
          paths=[Path(p) for p in manifest['atlas_parts']]
          texts=[''.join(p.read_text(encoding='utf-8').split()) for p in paths]
          print('chunks=',len(texts))
          for i,s in enumerate(texts):
              invalid=sorted(set(re.sub(r'[A-Za-z0-9+/=]','',s)))
              eq=[j for j,c in enumerate(s) if c=='=']
              print(f'{i:02d}: len={len(s)} mod4={len(s)%4} eq_count={len(eq)} eq_first={eq[:4]} eq_last={eq[-4:]} invalid={invalid} prefix={s[:12]!r} suffix={s[-12:]!r}')
          joined=''.join(texts)
          eq=[j for j,c in enumerate(joined) if c=='=']
          print('ALL:', 'len=',len(joined),'mod4=',len(joined)%4,'eq_count=',len(eq),'eq_positions=',eq[:30], 'last=',eq[-30:])
          try:
              data=base64.b64decode(joined,validate=True); print('ALL strict PASS bytes=',len(data),'prefix=',data[:16].hex())
          except Exception as e: print('ALL strict FAIL',type(e).__name__,e)
          print('VALID CONTIGUOUS GROUPS:')
          for start in range(len(texts)):
              value=''
              for end in range(start,len(texts)):
                  value += texts[end]
                  try:
                      data=base64.b64decode(value,validate=True)
                  except Exception:
                      continue
                  print(f' group {start:02d}-{end:02d}: chars={len(value)} bytes={len(data)} prefix={data[:12].hex()} suffix={data[-12:].hex()}')
