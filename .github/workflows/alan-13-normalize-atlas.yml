name: Normalize Alan Map 13 atlas chunks

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout 13.0 branch
        uses: actions/checkout@v4
        with:
          ref: agent/13-0-north-down-morphology-atlas
          fetch-depth: 0

      - name: Canonicalize complete atlas Base64 stream
        shell: python
        run: |
          import base64, hashlib, json, struct
          from pathlib import Path

          manifest_path=Path('data/mountains/mountain-icon-manifest-13.0.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          paths=[Path(p) for p in manifest['atlas_parts']]
          assert len(paths)==12,len(paths)

          compact_parts=[''.join(path.read_text(encoding='utf-8').split()) for path in paths]
          legacy=''.join(compact_parts)
          png=base64.b64decode(legacy,validate=True)
          assert png[:8]==b'\x89PNG\r\n\x1a\n'
          assert png[-12:]==b'\x00\x00\x00\x00IEND\xaeB`\x82'
          width,height=struct.unpack('>II',png[16:24])
          assert (width,height)==(800,1350),(width,height)
          digest=hashlib.sha256(png).hexdigest()

          canonical=base64.b64encode(png).decode('ascii')
          assert len(canonical)%4==0
          assert base64.b64decode(canonical,validate=True)==png

          base=(len(canonical)//len(paths)//4)*4
          assert base>0
          slices=[]
          offset=0
          for i,path in enumerate(paths):
              if i==len(paths)-1:
                  text=canonical[offset:]
              else:
                  text=canonical[offset:offset+base]
                  offset+=base
              assert text
              if i<len(paths)-1:
                  assert len(text)%4==0
                  assert '=' not in text
              path.write_text(text,encoding='utf-8')
              slices.append(text)

          joined=''.join(slices)
          assert joined==canonical
          assert base64.b64decode(joined,validate=True)==png
          manifest['sha256_png']=digest
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          print('Canonical atlas PASS')
          print('PNG:',width,'x',height,'bytes=',len(png))
          print('SHA256:',digest)
          print('legacy chars:',len(legacy),'canonical chars:',len(canonical))
          print('part chars:',[len(x) for x in slices])
          print('padding counts:',[x.count('=') for x in slices])

      - name: Validate browser-facing six virtual parts
        shell: python
        run: |
          import base64,hashlib,json,struct
          from pathlib import Path
          manifest=json.loads(Path('data/mountains/mountain-icon-manifest-13.0.json').read_text(encoding='utf-8'))
          texts=[Path(p).read_text(encoding='utf-8').strip() for p in manifest['atlas_parts']]
          joined=''.join(texts)
          png=base64.b64decode(joined,validate=True)
          assert png[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',png[16:24])==(800,1350)
          assert hashlib.sha256(png).hexdigest()==manifest['sha256_png']
          virtual=[texts[i]+texts[i+1] for i in range(0,12,2)]
          assert ''.join(virtual)==joined
          assert all('=' not in part for part in virtual[:-1])
          print('Runtime pairing PASS')

      - name: Commit normalized atlas to 13.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mountains/mountain-atlas-13.0.chunk-*.b64 data/mountains/mountain-icon-manifest-13.0.json
          git diff --cached --quiet && { echo 'Atlas already canonical'; exit 0; }
          git commit -m 'Canonicalize Alan Map 13.0 atlas Base64 stream'
          git push origin HEAD:agent/13-0-north-down-morphology-atlas
