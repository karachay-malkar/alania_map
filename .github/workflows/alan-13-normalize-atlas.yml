name: Diagnose Alan Map 13 PNG integrity

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout 13.0
        uses: actions/checkout@v4
        with:
          ref: agent/13-0-north-down-morphology-atlas
      - name: Parse PNG chunks and CRC
        shell: python
        run: |
          import base64,binascii,json,struct,zlib
          from pathlib import Path
          m=json.loads(Path('data/mountains/mountain-icon-manifest-13.0.json').read_text(encoding='utf-8'))
          text=''.join(''.join(Path(p).read_text(encoding='utf-8').split()) for p in m['atlas_parts'])
          png=base64.b64decode(text,validate=True)
          print('decoded bytes=',len(png),'head=',png[:16].hex(),'tail=',png[-32:].hex())
          assert png[:8]==b'\x89PNG\r\n\x1a\n'
          pos=8; index=0; valid_end=8
          while pos+12<=len(png):
              length=struct.unpack('>I',png[pos:pos+4])[0]
              typ=png[pos+4:pos+8]
              end=pos+12+length
              if end>len(png):
                  print('TRUNCATED chunk',index,'at',pos,'type=',typ,'length=',length,'needs=',end,'file=',len(png)); break
              data=png[pos+8:pos+8+length]
              stored=struct.unpack('>I',png[pos+8+length:end])[0]
              calc=zlib.crc32(typ+data)&0xffffffff
              printable=all(65<=c<=90 or 97<=c<=122 for c in typ)
              print(index,'pos=',pos,'type=',repr(typ),'length=',length,'printable=',printable,'crc=',stored==calc,'stored=',hex(stored),'calc=',hex(calc))
              if not printable or stored!=calc:
                  print('FIRST INVALID CHUNK at',index,'pos',pos); break
              valid_end=end; pos=end; index+=1
              if typ==b'IEND':
                  print('IEND PASS at',pos,'extra=',len(png)-pos); break
          print('valid_end=',valid_end,'remaining=',len(png)-valid_end,'next=',png[valid_end:valid_end+64].hex())
