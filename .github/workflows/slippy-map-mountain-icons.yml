name: Slippy Map 1.0 mountain icons QA
on:
  pull_request:
    branches: [slippy-map]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slippy-map
          fetch-depth: 0

      - name: Restore verified 36-icon PNG atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/slippy-atlas assets/mountains
          for i in $(seq 0 11); do
            p=$(printf '%03d' "$i")
            git show "origin/agent/13-0-north-down-morphology-atlas:assets/mountains/mountain-atlas-13.0.chunk-${p}.b64" > "/tmp/slippy-atlas/chunk-${p}.b64"
          done
          cat /tmp/slippy-atlas/chunk-*.b64 | base64 -d > assets/mountains/mountain-atlas.png
          echo 'c6a567297fc069f954996fcd36bd60d96f2dbcc80ecc452b2e1eacbf8e8fe8af  assets/mountains/mountain-atlas.png' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('assets/mountains/mountain-atlas.png')
          b=p.read_bytes()
          if b[:8] != b'\x89PNG\r\n\x1a\n': raise RuntimeError('Atlas is not PNG')
          w,h=struct.unpack('>II', b[16:24])
          if (w,h)!=(800,1350): raise RuntimeError(f'Atlas dimensions {(w,h)}')
          print({'atlas_bytes':len(b),'width':w,'height':h})
          PY

      - name: Build deterministic 1500-point icon layer
        run: |
          set -euo pipefail
          python3 tools/build_mountain_icon_layer.py
          python3 -m py_compile tools/build_mountain_icon_layer.py
          node --check src/config.js
          node --check src/data.js
          node --check src/map.js
          node --check src/main.js
          node tools/validate.mjs
          grep -q "'icon-anchor': 'bottom'" src/map.js
          grep -q "'icon-rotation-alignment': 'viewport'" src/map.js
          grep -q "'icon-pitch-alignment': 'viewport'" src/map.js
          grep -q "labelMinZoom: 9.5" src/config.js
          ! grep -R -E 'app-12|bootstrap-12|map-frame-12|mountain-render-12|part-[0-9]{3}\\.bin|force-cache' index.html styles.css src

      - name: Browser smoke in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/slippy-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} || true' EXIT
          mkdir -p /tmp/slippy-browser && cd /tmp/slippy-browser
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          cat > smoke.cjs <<'EOF'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const crypto = require('crypto');
          const assert = (v, m) => { if (!v) throw new Error(m); };
          const hash = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          (async () => {
            const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME, args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']});
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[]; const failed=[];
            page.on('console', m => { if (m.type()==='error') errors.push(m.text()); });
            page.on('pageerror', e => errors.push(String(e)));
            page.on('requestfailed', r => failed.push(`${r.url()} :: ${r.failure()?.errorText || ''}`));
            const response=await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle',timeout:30000});
            assert(response && response.ok(),'HTTP page load failed');
            await page.waitForFunction(() => document.querySelector('#status')?.textContent.includes('1500 горных фигурок загружены'), null, {timeout:30000});
            assert(await page.locator('canvas').count()===1,'MapLibre canvas missing');
            const stats=await page.locator('#stats').innerText();
            assert(stats.includes('PNG: 1500'),'1500 PNG count not rendered');
            const resources=await page.evaluate(() => performance.getEntriesByType('resource').map(e=>e.name));
            assert(resources.some(u=>u.endsWith('/assets/mountains/mountain-atlas.png')),'PNG atlas not requested');
            assert(resources.some(u=>u.endsWith('/data/mountain-icons-1500.geojson')),'1500-point layer not requested');
            assert(resources.every(u=>!/12\\.1|7\\.0\\.23|part-\\d{3}\\.bin|mountain-render/i.test(u)),`Old runtime request: ${resources.join('\\n')}`);
            await page.screenshot({path:'/tmp/far.png'});
            await page.mouse.move(760,470); await page.mouse.wheel(0,-2600); await page.waitForTimeout(1300);
            await page.screenshot({path:'/tmp/near.png'});
            assert(hash('/tmp/far.png')!==hash('/tmp/near.png'),'Zoom produced no visual change');
            const visibleLabels=page.locator('.main-label:not([hidden])');
            const labelCount=await visibleLabels.count();
            assert(labelCount>0,'Main mountain labels did not appear on close zoom');
            const pos=await visibleLabels.first().evaluate(el=>({x:parseFloat(el.style.left),y:parseFloat(el.style.top)+12,name:el.textContent}));
            assert(Number.isFinite(pos.x)&&Number.isFinite(pos.y),'Main label has no projected position');
            await page.mouse.click(pos.x,pos.y); await page.waitForTimeout(250);
            assert(!(await page.locator('#feature-card').evaluate(el=>el.hidden)),'Gold point interaction card did not open');
            assert((await page.locator('#feature-name').innerText()).trim().length>0,'Gold point interaction has no name');
            assert(errors.length===0,`Browser errors: ${errors.join('\\n')}`);
            assert(failed.length===0,`Failed requests: ${failed.join('\\n')}`);
            await page.screenshot({path:process.env.GITHUB_WORKSPACE+'/browser-qa.png'});
            console.log(JSON.stringify({ok:true,labelCount,clicked:pos.name,resources,status:await page.locator('#status').innerText()},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          EOF
          CHROME="$CHROME" node smoke.cjs
          cd "$GITHUB_WORKSPACE"

      - name: Commit generated runtime assets to slippy-map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mountains/mountain-atlas.png data/mountain-icons-1500.geojson data/icon-layer-report.json
          if git diff --cached --quiet; then
            echo 'Generated assets already committed.'
          else
            git commit -m 'Slippy Map 1.0: add verified 1500 mountain PNG layer'
            git push origin HEAD:slippy-map
          fi

      - name: Package exact runtime
        run: |
          set -euo pipefail
          mkdir -p build
          zip -9 -r build/slippy-map-1.0.zip index.html styles.css README.md src data assets vendor tools -x '.github/*' '*.DS_Store' 'tools/__pycache__/*'
          find index.html styles.css README.md src data assets vendor tools -type f ! -path '*/__pycache__/*' -printf '%p %s\n' | sort > build/file-sizes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: slippy-map-1.0-mountain-icons-qa
          path: |
            build/slippy-map-1.0.zip
            build/file-sizes.txt
            browser-qa.png
          retention-days: 14
          if-no-files-found: error
