name: Slippy Map 1.0 mountain icons QA
on:
  pull_request:
    branches: [slippy-map]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slippy-map
          fetch-depth: 0

      - name: Restore approved PNG atlas and build lossless WebP runtime atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/mountains
          cat assets/mountains/atlas-b64/part-*.b64 | tr -d '\r\n' | base64 -d > assets/mountains/mountain-atlas.png
          echo 'f0f668fabd6d21eae0088e84f0fafa61c688b4f6277efd8acb9fef7cd75195fd  assets/mountains/mountain-atlas.png' | sha256sum -c -
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          b=Path('assets/mountains/mountain-atlas.png').read_bytes()
          if b[:8] != b'\x89PNG\r\n\x1a\n': raise RuntimeError('Atlas is not PNG')
          w,h=struct.unpack('>II',b[16:24])
          if (w,h)!=(800,1350): raise RuntimeError(f'Atlas dimensions {(w,h)}')
          pos=8; seen_iend=False; idat=bytearray()
          while pos+12 <= len(b):
              n=struct.unpack('>I',b[pos:pos+4])[0]; kind=b[pos+4:pos+8]; end=pos+12+n
              if end>len(b): raise RuntimeError('Truncated PNG chunk')
              payload=b[pos+8:pos+8+n]
              if kind==b'IDAT': idat.extend(payload)
              if kind==b'IEND': seen_iend=True; break
              pos=end
          if not seen_iend or not idat: raise RuntimeError('PNG structure invalid')
          zlib.decompress(bytes(idat))
          print({'png_bytes':len(b),'width':w,'height':h})
          PY
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends webp >/dev/null
          cwebp -quiet -lossless -z 9 assets/mountains/mountain-atlas.png -o assets/mountains/mountain-atlas.webp
          test -s assets/mountains/mountain-atlas.webp
          webpinfo assets/mountains/mountain-atlas.webp | grep -q 'Canvas size: 800 x 1350'
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('assets/mountains/mountain-atlas.webp')
          print({'webp_bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          PY

      - name: Build and validate deterministic 1500-point layer
        run: |
          set -euo pipefail
          python3 tools/build_mountain_icon_layer.py
          python3 -m py_compile tools/build_mountain_icon_layer.py
          node --check src/config.js
          node --check src/data.js
          node --check src/map.js
          node --check src/main.js
          node tools/validate.mjs
          grep -q "'icon-anchor': 'bottom'" src/map.js
          grep -q "'icon-rotation-alignment': 'viewport'" src/map.js
          grep -q "'icon-pitch-alignment': 'viewport'" src/map.js
          grep -q "labelMinZoom: 9.5" src/config.js
          ! grep -R -E 'app-12|bootstrap-12|map-frame-12|mountain-render-12|part-[0-9]{3}\.bin|force-cache' index.html styles.css src

      - name: Browser smoke in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/slippy-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} || true' EXIT
          mkdir -p /tmp/slippy-browser && cd /tmp/slippy-browser
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          cat > smoke.cjs <<'EOF_JS'
          const { chromium } = require('playwright-core');
          const assert = (v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[],failed=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.url()} :: ${r.failure()?.errorText||''}`));
            const response=await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle',timeout:30000});
            assert(response&&response.ok(),'HTTP page load failed');
            await page.waitForFunction(()=>document.querySelector('#status')?.textContent.includes('1500 горных фигурок загружены'),null,{timeout:30000});
            assert(await page.locator('canvas').count()===1,'MapLibre canvas missing');
            assert((await page.locator('#stats').innerText()).includes('PNG: 1500'),'1500 icon count not rendered');
            const resources=await page.evaluate(()=>performance.getEntriesByType('resource').map(e=>e.name));
            assert(resources.some(u=>new URL(u).pathname.endsWith('/assets/mountains/mountain-atlas.png')),'PNG atlas not requested');
            assert(resources.some(u=>new URL(u).pathname.endsWith('/data/mountain-icons-1500.geojson')),'1500-point layer not requested');
            assert(errors.length===0,`Browser errors: ${errors.join('\n')}`);
            assert(failed.length===0,`Failed requests: ${failed.join('\n')}`);
            console.log(JSON.stringify({ok:true,status:await page.locator('#status').innerText(),resources},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF_JS
          CHROME="$CHROME" node smoke.cjs
          cd "$GITHUB_WORKSPACE"

      - name: Commit generated WebP atlas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mountains/mountain-atlas.webp data/mountain-icons-1500.geojson data/icon-layer-report.json
          if git diff --cached --quiet; then
            echo 'Generated assets already committed.'
          else
            git commit -m 'Slippy Map 1.0: add lossless WebP runtime atlas'
            git push origin HEAD:slippy-map
          fi

      - name: Package exact runtime
        run: |
          set -euo pipefail
          mkdir -p build
          zip -9 -r build/slippy-map-1.0.zip index.html styles.css README.md src data assets vendor tools \
            -x '.github/*' '*.DS_Store' 'tools/__pycache__/*' 'tools/.mountain-atlas-upload.b64'
          find index.html styles.css README.md src data assets vendor tools -type f ! -path '*/__pycache__/*' ! -name '.mountain-atlas-upload.b64' -printf '%p %s\n' | sort > build/file-sizes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: slippy-map-1.0-webp-prep-qa
          path: |
            build/slippy-map-1.0.zip
            build/file-sizes.txt
          retention-days: 14
          if-no-files-found: error
