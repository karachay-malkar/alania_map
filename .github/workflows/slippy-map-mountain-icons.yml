name: Slippy Map 1.0.1 live QA

on:
  pull_request:
    branches: [slippy-map]

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slippy-map
          fetch-depth: 0

      - name: Rebuild approved 36-icon atlas from verified repository source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/13-0-north-down-morphology-atlas:refs/remotes/origin/atlas13
          python3 - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          ref='refs/remotes/origin/atlas13'
          manifest=json.loads(subprocess.check_output(['git','show',f'{ref}:data/mountains/mountain-icon-manifest-13.0.json'],text=True))
          assert manifest['source']=='mountain_icons_final_9_categories(1).zip'
          assert manifest['atlas_width']==800 and manifest['atlas_height']==1350
          assert len(manifest['icons'])==36
          cats={}
          for icon in manifest['icons']: cats[icon['category']]=cats.get(icon['category'],0)+1
          assert len(cats)==9 and set(cats.values())=={4},cats
          text=''
          for path in manifest['atlas_parts']:
              text+=''.join(subprocess.check_output(['git','show',f'{ref}:{path}'],text=True).split())
          raw=base64.b64decode(text,validate=True)
          assert raw[:8]==b'\x89PNG\r\n\x1a\n'
          assert hashlib.sha256(raw).hexdigest()==manifest['sha256_png']
          Path('assets/mountains/mountain-atlas-source.png').write_bytes(raw)
          print('Approved 13.0 atlas source bytes=',len(raw),'sha256=',hashlib.sha256(raw).hexdigest())
          PY
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/atlas-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} || true' EXIT
          mkdir -p /tmp/atlas-browser
          cd /tmp/atlas-browser
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          cat > normalize.cjs <<'EOF'
          const { chromium }=require('playwright-core');
          const fs=require('fs');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:900,height:1450}});
            const response=await page.goto('http://127.0.0.1:4173/assets/mountains/mountain-atlas-source.png',{waitUntil:'load',timeout:30000});
            assert(response&&response.ok(),'approved atlas HTTP load failed');
            const result=await page.evaluate(async()=>{
              const img=document.querySelector('img');
              if(!img)throw new Error('image document missing img');
              await img.decode();
              assert=(v,m)=>{if(!v)throw new Error(m)};
              assert(img.naturalWidth===800&&img.naturalHeight===1350,`atlas ${img.naturalWidth}x${img.naturalHeight}`);
              const c=document.createElement('canvas'); c.width=800;c.height=1350;
              const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
              const counts=[];
              for(let r=0;r<9;r++)for(let col=0;col<4;col++){
                const d=ctx.getImageData(col*200,r*150,200,150).data;let n=0;
                for(let i=3;i<d.length;i+=4)if(d[i]>0)n++;
                counts.push(n);
              }
              assert(counts.length===36&&!counts.some(n=>n<100),'blank atlas cell '+JSON.stringify(counts));
              return {png:c.toDataURL('image/png').split(',')[1],counts};
            });
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/assets/mountains/mountain-atlas-normalized.png',Buffer.from(result.png,'base64'));
            console.log('36 atlas cells PASS',result.counts);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          CHROME="$CHROME" node normalize.cjs
          cd "$GITHUB_WORKSPACE"
          kill ${SERVER_PID} || true
          trap - EXIT
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends webp >/dev/null
          cwebp -quiet -lossless -z 9 assets/mountains/mountain-atlas-normalized.png -o assets/mountains/mountain-atlas.webp
          webpinfo assets/mountains/mountain-atlas.webp | grep -q 'Canvas size: 800 x 1350'
          rm -f assets/mountains/mountain-atlas-source.png assets/mountains/mountain-atlas-normalized.png
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          atlas=Path('assets/mountains/mountain-atlas.webp')
          manifest_path=Path('assets/mountains/atlas-manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['sha256_webp']=hashlib.sha256(atlas.read_bytes()).hexdigest()
          manifest['build']='approved 36-icon 9-category atlas -> Chromium normalized RGBA -> lossless WebP'
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          env=f"WEBP_BYTES={atlas.stat().st_size}\nWEBP_SHA256={manifest['sha256_webp']}\n"
          Path('/tmp/webp-env').write_text(env,encoding='utf-8')
          print(env)
          PY
          cat /tmp/webp-env >> "$GITHUB_ENV"

      - name: Commit exact runtime and remove obsolete payloads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mountains/mountain-atlas.webp assets/mountains/atlas-manifest.json
          git rm -f assets/mountains/mountain-atlas.png 2>/dev/null || true
          git rm -r -f assets/mountains/webp-b64 2>/dev/null || true
          git rm -r -f assets/mountains/atlas-b64 2>/dev/null || true
          git rm -f tools/.mountain-atlas-upload.b64 2>/dev/null || true
          git commit -m 'Slippy Map 1.0.1: finalize approved lossless WebP atlas'
          git push origin HEAD:slippy-map

      - name: Contract validation
        shell: bash
        run: |
          set -euo pipefail
          node --check src/config.js
          node --check src/data.js
          node --check src/map.js
          node --check src/main.js
          node tools/validate.mjs
          test -s assets/mountains/mountain-atlas.webp
          test ! -e assets/mountains/mountain-atlas.png
          test "$(stat -c '%s' assets/mountains/mountain-atlas.webp)" = "$WEBP_BYTES"
          echo "$WEBP_SHA256  assets/mountains/mountain-atlas.webp" | sha256sum -c -
          grep -q "mountain-atlas.webp?v=1.0.1" src/config.js
          ! grep -R "cache: 'no-store'" src

      - name: Local desktop and mobile browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/local-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} || true' EXIT
          cd /tmp/atlas-browser
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          cat > smoke.cjs <<'EOF'
          const { chromium }=require('playwright-core');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [name,viewport] of [['desktop',{width:1440,height:900}],['mobile',{width:412,height:915}]]){
              const page=await browser.newPage({viewport});const errors=[],failed=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('pageerror',e=>errors.push(String(e)));page.on('requestfailed',r=>failed.push(r.url()));
              const res=await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:45000});assert(res&&res.ok(),'local HTTP');
              await page.waitForFunction(()=>document.querySelector('#status')?.textContent.includes('1500 горных фигурок загружены'),null,{timeout:45000});
              assert((await page.locator('#stats').innerText()).includes('Фигурок: 1500'),'1500 count');assert((await page.locator('canvas').count())===1,'canvas');
              const r=await page.evaluate(()=>performance.getEntriesByType('resource').map(e=>new URL(e.name).pathname));
              assert(r.filter(p=>p.endsWith('/assets/mountains/mountain-atlas.webp')).length===1,'one webp');assert(!r.some(p=>p.endsWith('/assets/mountains/mountain-atlas.png')),'png request');
              assert(!errors.length,'errors '+errors.join('\n'));assert(!failed.length,'failed '+failed.join('\n'));
              await page.screenshot({path:`${process.env.GITHUB_WORKSPACE}/qa-local-${name}.png`,fullPage:true});await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          CHROME="$CHROME" node smoke.cjs

      - name: Verify published GitHub Pages asset
        shell: bash
        run: |
          set -euo pipefail
          candidates=('https://karachay-malkar.github.io/alania_map/' 'https://karachay-malkar.github.io/')
          : > /tmp/live-base
          for attempt in $(seq 1 72); do
            for base in "${candidates[@]}"; do
              if curl -fsSL --max-time 15 "${base}?qa=${GITHUB_RUN_ID}-${attempt}" -o /tmp/live.html 2>/dev/null && grep -q 'Slippy Map 1.0.1' /tmp/live.html; then
                if curl -fsSL --max-time 20 "${base}assets/mountains/mountain-atlas.webp?v=1.0.1&qa=${GITHUB_RUN_ID}-${attempt}" -o /tmp/live.webp 2>/dev/null; then
                  if [ "$(stat -c '%s' /tmp/live.webp)" = "$WEBP_BYTES" ] && echo "$WEBP_SHA256  /tmp/live.webp" | sha256sum -c - >/dev/null 2>&1; then printf '%s' "$base" >/tmp/live-base;break 2;fi
                fi
              fi
            done
            sleep 5
          done
          BASE="$(cat /tmp/live-base)";test -n "$BASE";echo "Live base: $BASE";echo "LIVE_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Live desktop and mobile browser QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/atlas-browser
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          sed "s#http://127.0.0.1:4173/#${LIVE_BASE}#g" smoke.cjs > live.cjs
          CHROME="$CHROME" node live.cjs
          cp "$GITHUB_WORKSPACE/qa-local-desktop.png" "$GITHUB_WORKSPACE/qa-live-desktop.png"
          cp "$GITHUB_WORKSPACE/qa-local-mobile.png" "$GITHUB_WORKSPACE/qa-live-mobile.png"

      - name: Package exact verified runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          find . -type f ! -path './.git/*' ! -path './build/*' -printf '%P\t%s bytes\n' | sort > build/file-sizes.txt
          zip -9 -r build/slippy-map-1.0.1-fixed.zip . -x '.git/*' 'build/*' '*.DS_Store' >/dev/null
          sha256sum build/slippy-map-1.0.1-fixed.zip > build/archive-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: slippy-map-1.0.1-fixed-live-qa
          path: |
            build/slippy-map-1.0.1-fixed.zip
            build/file-sizes.txt
            build/archive-sha256.txt
            qa-local-desktop.png
            qa-local-mobile.png
            qa-live-desktop.png
            qa-live-mobile.png
          retention-days: 14
          if-no-files-found: error
