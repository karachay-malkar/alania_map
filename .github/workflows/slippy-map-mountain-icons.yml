name: Slippy Map 1.0.1 WebP atlas integrity QA
on:
  pull_request:
    branches: [slippy-map]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slippy-map
          fetch-depth: 0

      - name: Verify uploaded WebP payload parts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/webp-parts.sha256 <<'EOF'
          9388ee919a80911135b94ee95056aff2b3693603343d5885ea44a8dc1fe69c6b  assets/mountains/webp-b64/part-00.b64
          4eb4bd68b7c4a70ada968fcc6833569c0ea59ce21269de0a3ed135557df545f8  assets/mountains/webp-b64/part-01.b64
          33511c8f944962e8e7fd7ff37bb2ca353de889620c3ac0e192d94907fa26fee7  assets/mountains/webp-b64/part-02.b64
          2840995c42d020758257a2bde1d47cac2a186a097f7978de32c91dd072f1d766  assets/mountains/webp-b64/part-03.b64
          2a94e31cb7ba4af6f2f7368b346440007ce9f8dac4eaa6e0ac491d63619b4c35  assets/mountains/webp-b64/part-04.b64
          4a30f5901a43ab33fa74a1c673c5c39b9f0e2b407f8936d14bb642b01fb6e4ef  assets/mountains/webp-b64/part-05a.b64
          b801c27903ceb03e571cff310be4def6f375f3896ccf26eb1f6d42afcdf0bcdf  assets/mountains/webp-b64/part-05b.b64
          f51f4d9093998106f50746fcea18d2bfc0f506800a58f955ffd8608b3a150238  assets/mountains/webp-b64/part-05c.b64
          05540faecac0e6cb709134a21d904da9d935d6f224d8878f8bcd03171b6efad5  assets/mountains/webp-b64/part-05d.b64
          3b91a93a9e056a60ff986a6c13f4b9f8fc5ccf51254b3e7428bb3bb22d93738c  assets/mountains/webp-b64/part-06a.b64
          9263601814928f09bfa5be186fbd22c1f6b0b6af9d19ab927e31a1768db64a15  assets/mountains/webp-b64/part-06b.b64
          96f86345f0d86d54c20a8c9650f1b8722a4339754650b9779664962918bdaeaf  assets/mountains/webp-b64/part-06c.b64
          f53c04e156522467af00f7dee00c3aed64c844c73e28b0a42f23800b97404f1f  assets/mountains/webp-b64/part-06d.b64
          d54764d7636ec8525878f0ab00f388d67da13418285adac949fc422ab97022df  assets/mountains/webp-b64/part-07a.b64
          779a6f555c21efbd39a0533a60e9299d3d85bcbf0260b42410594c8c20b75b43  assets/mountains/webp-b64/part-07b.b64
          EOF
          sha256sum -c /tmp/webp-parts.sha256

      - name: Reconstruct and validate exact atlas
        shell: bash
        run: |
          set -euo pipefail
          cat assets/mountains/webp-b64/part-*.b64 | tr -d '\r\n' | base64 -d > /tmp/mountain-atlas.webp
          echo '0aaf616dfd6441abf01e6c48675c64aedb767413798ad130c53146241fa3066f  /tmp/mountain-atlas.webp' | sha256sum -c -
          test "$(stat -c '%s' /tmp/mountain-atlas.webp)" = '109454'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends webp >/dev/null
          webpinfo /tmp/mountain-atlas.webp | grep -q 'Canvas size: 800 x 1350'
          echo 'WebP atlas payload integrity PASS'
