name: Apply Alan Map 7.0.25 r4 final

on:
  push:
    branches: [7.0.25]
    paths:
      - '.github/workflows/apply-7.0.25-r4-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply source changes
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('assets/map-ui.js'); s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"\n  function settlementBeamCollections\(objects\) \{.*?\n  \}\n\n  function interpolatePoint", "\n  function interpolatePoint", s, count=1, flags=re.S); assert n==1
          s,n=re.subn(r"\n    const chevrons = \[0\.10,0\.16,0\.22,0\.28\]\.map\(\(t,index\) => \{.*?\n    const compassCoordinates =", "\n    const compassCoordinates =", s, count=1, flags=re.S); assert n==1
          s=s.replace("    return {polygon,edge,ornament,compass,tornEdge,compassCoordinates};","    return {polygon,edge,compass,tornEdge,compassCoordinates};",1)
          s=s.replace('      <path data-role="parchment-ornament" fill="none" stroke="#68482f" stroke-width="1.5" stroke-opacity=".68" stroke-linecap="round" stroke-linejoin="round"/>\n','',1)
          s=s.replace("    const beams = settlementBeamCollections(data?.objects);\n",'',1)
          s=s.replace("        ['peakSnow', data.peakSnow],\n        ['settlementBeamHalo', beams.halo],\n        ['settlementBeamCore', beams.core]\n","        ['peakSnow', data.peakSnow]\n",1)
          s=s.replace("      presentation:{regionalLabels,boundaries,beamCount:beams.count,parchment}\n","      presentation:{regionalLabels,boundaries,parchment}\n",1)
          s,n=re.subn(r"\n      const settlementBeamLayers = \[\n.*?\n      \];\n\n      const pointLayers =","\n      const pointLayers =",s,count=1,flags=re.S); assert n==1
          s=s.replace("        ...lineLayers,\n        ...settlementBeamLayers,\n        ...pointLayers,","        ...lineLayers,\n        ...pointLayers,",1)
          s,n=re.subn(r"\n      const ornamentPath = geometry\.ornament\.features\.map\(\(feature\) => projectedPath\(feature\.geometry\.coordinates,false\)\)\.filter\(Boolean\)\.join\(' '\);\n      parchmentOverlay\.querySelector\('\[data-role=\"parchment-ornament\"\]'\)\?\.setAttribute\('d',ornamentPath\);",'',s,count=1); assert n==1
          s=s.replace("        settlementBeamCount:runtimeSources.presentation.beamCount,\n",'',1).replace("      settlementBeamCollections,\n",'',1)
          s=s.replace("  const REGIONAL_LABEL_NARSANA_SCALE = 0.666667;\n","  const REGIONAL_LABEL_NARSANA_SCALE = 0.666667;\n  const PARCHMENT_COMPASS_RADIUS_M = 22000;\n",1)
          old="""      const compassPoint = projectMapPoint(geometry.compassCoordinates);
          if (compassPoint) {
            const scale = clamp(Math.min(width,height) / 820,0.72,1.08);
            const bearing = Number(map.getBearing?.() || 0);
            parchmentOverlay.querySelector('[data-role=\"parchment-compass\"]')?.setAttribute(
              'transform',
              `translate(${compassPoint[0].toFixed(2)} ${compassPoint[1].toFixed(2)}) rotate(${-bearing.toFixed(3)}) scale(${scale.toFixed(3)})`
            );
          }
          """
          new="""      const compassCenter = geometry.compassCoordinates;
          const compassPoint = projectMapPoint(compassCenter);
          const compassLatRadians = Number(compassCenter?.[1] || 0) * Math.PI / 180;
          const compassLonScale = Math.max(1,111320 * Math.cos(compassLatRadians));
          const compassEast = projectMapPoint([compassCenter[0] + PARCHMENT_COMPASS_RADIUS_M / compassLonScale,compassCenter[1]]);
          const compassSouth = projectMapPoint([compassCenter[0],compassCenter[1] - PARCHMENT_COMPASS_RADIUS_M / 110574]);
          if (compassPoint && compassEast && compassSouth) {
            const localRadius = 53;
            const a = (compassEast[0] - compassPoint[0]) / localRadius;
            const b = (compassEast[1] - compassPoint[1]) / localRadius;
            const c = (compassSouth[0] - compassPoint[0]) / localRadius;
            const d = (compassSouth[1] - compassPoint[1]) / localRadius;
            const compass = parchmentOverlay.querySelector('[data-role=\"parchment-compass\"]');
            compass?.setAttribute('transform',`matrix(${a.toFixed(6)} ${b.toFixed(6)} ${c.toFixed(6)} ${d.toFixed(6)} ${compassPoint[0].toFixed(2)} ${compassPoint[1].toFixed(2)})`);
            compass?.setAttribute('data-map-plane-aligned','true');
            compass?.setAttribute('data-world-radius-m',String(PARCHMENT_COMPASS_RADIUS_M));
          }
          """
          assert old in s; s=s.replace(old,new,1)
          s=s.replace("        parchmentCompass:runtimeSources.presentation.parchment.compassCoordinates,\n","        parchmentCompass:runtimeSources.presentation.parchment.compassCoordinates,\n        parchmentCompassRadiusM:PARCHMENT_COMPASS_RADIUS_M,\n",1)
          s=s.replace("      parchmentCorner:PARCHMENT_CORNER,\n","      parchmentCorner:PARCHMENT_CORNER,\n      parchmentCompassRadiusM:PARCHMENT_COMPASS_RADIUS_M,\n",1)
          assert 'settlementBeam' not in s and 'settlement-beam' not in s and 'parchment-ornament' not in s
          p.write_text(s,encoding='utf-8')

          p=Path('assets/map-presentation.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("  const BEAM_LAYER_IDS = Object.freeze(['settlement-beam-halo', 'settlement-beam-core']);\n",'',1)
          s,n=re.subn(r"\n  function removeSettlementBeams\(map\) \{.*?\n  \}\n",'\n',s,count=1,flags=re.S); assert n==1
          s=s.replace("      removeSettlementBeams(map);\n",'').replace("    removeSettlementBeams(map);\n",'')
          s=s.replace("    map.on?.('styledata', () => { removeSettlementBeams(map); queueUpdate(); });\n","    map.on?.('styledata', queueUpdate);\n",1)
          s=s.replace("      beamLayersRemoved:() => BEAM_LAYER_IDS.every((layerId) => !map.getLayer?.(layerId)),\n",'',1)
          s=s.replace("      ornamentColor:ORNAMENT_COLOR,\n      beamLayerIds:BEAM_LAYER_IDS\n","      ornamentColor:ORNAMENT_COLOR\n",1)
          s,n=re.subn(r"\n  function offsetLngLat\(\[lon, lat\], eastM, northM\) \{.*?\n  \}\n\n  function installOnMap","\n  function installOnMap",s,count=1,flags=re.S); assert n==1
          s=s.replace("    const compassLngLat = api?.getPresentationDiagnostics?.().parchmentCompass || null;\n",'',1)
          s=s.replace("      applyCompassTransform(map, container, compassLngLat);\n",'',1)
          s=s.replace("      ornamentPath,\n      offsetLngLat\n","      ornamentPath\n",1)
          assert 'settlement-beam' not in s and 'applyCompassTransform' not in s and 'offsetLngLat' not in s
          p.write_text(s,encoding='utf-8')

          p=Path('tests/runtime-contract.mjs'); s=p.read_text(encoding='utf-8')
          s=s.replace("assert.ok(runtimeSources.presentation.beamCount > 0);\nassert.ok(runtimeSources.polygons.features.some(feature => feature.properties?.alan_source === 'settlementBeamHalo'));\nassert.ok(runtimeSources.polygons.features.some(feature => feature.properties?.alan_source === 'settlementBeamCore'));\n","assert.ok(!runtimeSources.polygons.features.some(feature => String(feature.properties?.alan_source || '').startsWith('settlementBeam')));\nassert.ok(!uiSource.includes('settlementBeam'));\nassert.ok(!uiSource.includes('settlement-beam'));\n",1)
          s=s.replace("assert.equal(parchment.ornament.features.length,5);\n","assert.equal('ornament' in parchment,false);\n",1)
          s=s.replace("assert.match(uiSource, /id:'settlement-beam-halo'.*?maxzoom:OBJECT_PRESENTATION\\.currentSettlements\\.minZoom/s);\nassert.match(uiSource, /id:'settlement-beam-core'.*?fill-extrusion-height':10000/s);\n","assert.ok(!uiSource.includes('parchment-ornament'));\n",1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/map-smoke.mjs'); s=p.read_text(encoding='utf-8')
          s=s.replace("        beamLayersRemoved:window.ALAN_MAP_PRESENTATION_7025?.beamLayersRemoved?.(),\n",'',1).replace("  assert.equal(diagnostics.overlay.beamLayersRemoved,true);\n",'',1)
          old="""  await page.waitForTimeout(250);
          const compassScaleAfter = await page.evaluate(() => {
            const transform = document.querySelector('[data-role=\"parchment-compass\"]')?.getAttribute('transform') || '';
            const values = transform.match(/^matrix\\(([^)]+)\\)/)?.[1].trim().split(/\\s+/).map(Number) || [];
            return values.length >= 4 ? Math.hypot(values[0],values[1]) : 0;
          });
          assert.ok(compassScaleBefore > 0);
          assert.ok(compassScaleAfter > compassScaleBefore, `compass did not grow with zoom: ${compassScaleBefore} -> ${compassScaleAfter}`);
          """
          new="""  assert.ok(compassScaleBefore > 0);
          await page.waitForFunction((before) => {
            const transform = document.querySelector('[data-role=\"parchment-compass\"]')?.getAttribute('transform') || '';
            const values = transform.match(/^matrix\\(([^)]+)\\)/)?.[1].trim().split(/\\s+/).map(Number) || [];
            const scale = values.length >= 4 ? Math.hypot(values[0],values[1]) : 0;
            return scale > before;
          },compassScaleBefore,{timeout:5000});
          const compassScaleAfter = await page.evaluate(() => {
            const transform = document.querySelector('[data-role=\"parchment-compass\"]')?.getAttribute('transform') || '';
            const values = transform.match(/^matrix\\(([^)]+)\\)/)?.[1].trim().split(/\\s+/).map(Number) || [];
            return values.length >= 4 ? Math.hypot(values[0],values[1]) : 0;
          });
          assert.ok(compassScaleAfter > compassScaleBefore, `compass did not grow with zoom: ${compassScaleBefore} -> ${compassScaleAfter}`);
          """
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate and browser-smoke
        run: |
          set -euxo pipefail
          node --check assets/map-ui.js
          node --check assets/map-presentation.js
          node --check tests/map-smoke.mjs
          python tools/release_7_0_25.py validate
          node tests/runtime-contract.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/map-smoke.mjs

      - name: Commit final implementation
        run: |
          set -euxo pipefail
          rm -f .github/workflows/apply-7.0.25-r4-cleanup.yml .github/workflows/apply-7.0.25-r4-final.yml
          git config user.name 'Alan Map Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Alan Map 7.0.25 r4 presentation [skip ci]'
          git push origin HEAD:7.0.25
