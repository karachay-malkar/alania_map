name: Validate fantasy map

on:
  push:
    branches:
      - 7.0.23
    paths:
      - '.github/workflows/validate-fantasy-map.yml'
      - 'assets/bootstrap.js'
      - 'assets/map-page.js'
      - 'assets/map-ui.js'
      - 'assets/fantasy-relief.js'
      - 'assets/fantasy-style.js'
      - 'tests/**'
      - 'index.html'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fantasy-map-7.0.23-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate static runtime contract
        run: node tests/runtime-contract.mjs

      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: |
          mkdir -p build
          python3 -m http.server 8000 > build/http-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node tests/map-smoke.mjs

      - name: Create full project archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path('.')
          output = Path('build/alan-map-7.0.23-fantasy-hybrid.zip')
          excluded = {'.git', 'build', 'node_modules', 'playwright-report', 'test-results', '__pycache__'}
          with ZipFile(output, 'w', ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or any(part in excluded for part in path.parts):
                      continue
                  archive.write(path, path.as_posix())

          paths = [
              'index.html', 'README.md', 'DATA-SOURCES-AND-LICENSES.md',
              'assets/bootstrap.js', 'assets/map-page.js', 'assets/map-ui.js',
              'assets/fantasy-relief.js', 'assets/fantasy-style.js',
              'assets/map-data.part-000.js', 'assets/map-data.part-001.js',
              'data/vector-build-manifest.json', 'data/shards-manifest.json',
              'data/river-network-report.json', 'data/natural-layer-report.json'
          ]
          result = {path: Path(path).stat().st_size for path in paths}
          result['data/shards/vector-7.0.23'] = sum(path.stat().st_size for path in Path('data/shards/vector-7.0.23').glob('part-*.bin'))
          result['data/shards/vector_count'] = len(list(Path('data/shards/vector-7.0.23').glob('part-*.bin')))
          result['data/shards/dem-7.0.21'] = sum(path.stat().st_size for path in Path('data/shards/dem-7.0.21').glob('part-*.bin'))
          result[output.name] = output.stat().st_size
          Path('build/file-sizes-fantasy.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alan-map-7.0.23-fantasy-validation
          path: |
            build/map-smoke.png
            build/browser-diagnostics.json
            build/http-server.log
          if-no-files-found: warn

      - name: Upload full project archive
        uses: actions/upload-artifact@v4
        with:
          name: alan-map-7.0.23-fantasy-package
          path: |
            build/alan-map-7.0.23-fantasy-hybrid.zip
            build/file-sizes-fantasy.json
          if-no-files-found: error
