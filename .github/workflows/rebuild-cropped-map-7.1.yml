name: Build Alan Map 7.1 physical DEM polygon crop

on:
  push:
    branches: [7.1]
    paths:
      - 'tools/release_7_1.py'
      - 'tools/crop_dem_mbtiles_to_frame.py'
      - '.github/workflows/rebuild-cropped-map-7.1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alan-map-7-1-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install DEM build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal sqlite3 zip
          python -m pip install --break-system-packages --upgrade pip
          python -m pip install --break-system-packages rasterio rio-rgbify pillow numpy shapely
          go install github.com/protomaps/go-pmtiles@v1.30.1
          GO_BIN="$(go env GOPATH)/bin"
          test -x "$GO_BIN/go-pmtiles"
          ln -sf "$GO_BIN/go-pmtiles" "$GO_BIN/pmtiles"
          echo "$GO_BIN" >> "$GITHUB_PATH"

      - name: Prepare 7.1 runtime and exact map frame
        run: |
          set -euxo pipefail
          python tools/release_7_1.py prepare
          python - <<'PY'
          import json
          expected=[40.51784,42.734095,44.184003,44.534975]
          expected_ring=[[40.51784,43.41265],[43.731622,42.734095],[44.184003,43.85642],[40.970221,44.534975],[40.51784,43.41265]]
          actual=json.load(open('build/rectangular-bounds.json'))['bounds']
          frame=json.load(open('build/map-frame.geojson'))['features'][0]['geometry']['coordinates'][0]
          if actual != expected:
              raise SystemExit(f'Unexpected tile envelope: {actual}')
          if frame != expected_ring:
              raise SystemExit(f'Unexpected rotated frame: {frame}')
          print('7.1 frame:', frame)
          PY

      - name: Download Copernicus DEM GLO-30 source COGs
        run: |
          set -euxo pipefail
          mkdir -p build/copernicus-dem
          python - <<'PY'
          import json, math, pathlib, urllib.request
          west,south,east,north=json.load(open('build/rectangular-bounds.json'))['bounds']
          out=pathlib.Path('build/copernicus-dem')
          for lat in range(math.floor(south),math.ceil(north)):
              for lon in range(math.floor(west),math.ceil(east)):
                  ns='N' if lat >= 0 else 'S'
                  ew='E' if lon >= 0 else 'W'
                  tile=f'Copernicus_DSM_COG_10_{ns}{abs(lat):02d}_00_{ew}{abs(lon):03d}_00_DEM'
                  url=f'https://copernicus-dem-30m.s3.eu-central-1.amazonaws.com/{tile}/{tile}.tif'
                  target=out/f'{tile}.tif'
                  print('download', url)
                  request=urllib.request.Request(url,headers={'User-Agent':'AlanMap/7.1'})
                  with urllib.request.urlopen(request,timeout=240) as response,target.open('wb') as handle:
                      while True:
                          chunk=response.read(1024*1024)
                          if not chunk:
                              break
                          handle.write(chunk)
          PY

      - name: Warp DEM through polygon cutline
        run: |
          set -euxo pipefail
          read WEST SOUTH EAST NORTH < <(python - <<'PY'
          import json
          print(*json.load(open('build/rectangular-bounds.json'))['bounds'])
          PY
          )
          gdalbuildvrt build/copernicus-dem.vrt build/copernicus-dem/*.tif
          gdalwarp -overwrite \
            -t_srs EPSG:4326 \
            -te "$WEST" "$SOUTH" "$EAST" "$NORTH" \
            -cutline build/map-frame.geojson -crop_to_cutline \
            -dstnodata -10000 -r bilinear \
            -of GTiff -co TILED=YES -co COMPRESS=DEFLATE -co BIGTIFF=IF_SAFER \
            build/copernicus-dem.vrt build/copernicus-dem-7.1-cutline.tif
          gdalinfo -json build/copernicus-dem-7.1-cutline.tif > build/copernicus-dem-7.1-cutline.info.json

      - name: Encode Terrain-RGB and physically remove outside tiles and pixels
        run: |
          set -euxo pipefail
          rio rgbify -b -10000 -i 0.1 --min-z 7 --max-z 12 -j 4 --format png \
            build/copernicus-dem-7.1-cutline.tif build/alan-dem-7.1.mbtiles
          python tools/crop_dem_mbtiles_to_frame.py \
            build/alan-dem-7.1.mbtiles --frame build/map-frame.geojson \
            | tee build/dem-crop-report.json
          python tools/crop_dem_mbtiles_to_frame.py \
            build/alan-dem-7.1.mbtiles --frame build/map-frame.geojson --validate \
            | tee build/dem-crop-validation.json
          pmtiles convert build/alan-dem-7.1.mbtiles build/alan-dem-7.1.pmtiles
          pmtiles verify build/alan-dem-7.1.pmtiles
          ls -lh build/alan-dem-7.1.mbtiles build/alan-dem-7.1.pmtiles

      - name: Verify DEM size reduction
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json, pathlib
          baseline=408_983_932
          current=pathlib.Path('build/alan-dem-7.1.pmtiles').stat().st_size
          if current >= baseline:
              raise SystemExit(f'7.1 DEM was not reduced: {current} >= {baseline}')
          report=json.load(open('build/dem-crop-report.json'))
          if report.get('tiles_removed',0) <= 0:
              raise SystemExit(f'No wholly outside tiles were removed: {report}')
          if report.get('partial_tiles_masked',0) <= 0:
              raise SystemExit(f'No boundary tiles were masked: {report}')
          reduction=1-current/baseline
          summary={
              'baseline_dem_bytes_7_0_25':baseline,
              'dem_bytes_7_1':current,
              'reduction_fraction':reduction,
              'crop':report,
          }
          pathlib.Path('build/dem-size-summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY

      - name: Integrate 7.1 DEM shards without rebuilding vectors
        run: |
          set -euxo pipefail
          python tools/release_7_1.py finalize --dem build/alan-dem-7.1.pmtiles
          cp build/dem-crop-report.json data/dem-crop-report.json
          cp build/dem-crop-validation.json data/dem-crop-validation.json
          cp build/dem-size-summary.json data/dem-size-summary.json
          rm -f data/alan-dem-7.1.pmtiles
          rm -rf data/shards/dem-7.0.25
          test ! -d data/shards/dem-7.0.25
          test -d data/shards/dem-7.1

      - name: Validate 7.1 runtime and data contract
        run: |
          set -euxo pipefail
          python tools/release_7_1.py validate
          node tests/runtime-contract.mjs
          if grep -RniE "const VERSION = '7\.0\.25'|alan-map-stage7\.0\.25-view|7\.0\.25-r[0-9]+" assets index.html tests; then
            echo 'Stale 7.0.25 runtime reference remains' >&2
            exit 1
          fi

      - name: Browser smoke test
        run: |
          set -euxo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/map-smoke.mjs

      - name: Commit generated 7.1 project
        run: |
          set -euxo pipefail
          git config user.name 'Alan Map Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Build Alan Map 7.1 physical DEM polygon crop'
            git push origin HEAD:7.1
          fi

      - name: Package full 7.1 project and file sizes
        run: |
          set -euxo pipefail
          mkdir -p /tmp/alan-map-7-1
          find . -type f \
            -not -path './.git/*' -not -path './build/*' -not -path './node_modules/*' \
            -printf '%P\t%s\n' | sort > /tmp/alan-map-7-1/file-sizes-7.1.tsv
          cp build/dem-size-summary.json /tmp/alan-map-7-1/dem-size-summary.json
          zip -qr /tmp/alan-map-7-1/alan-map-7.1.zip . \
            -x '.git/*' 'build/*' 'node_modules/*'
          unzip -tq /tmp/alan-map-7-1/alan-map-7.1.zip
          ls -lh /tmp/alan-map-7-1/alan-map-7.1.zip
          wc -l /tmp/alan-map-7-1/file-sizes-7.1.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: alan-map-7.1-full
          path: /tmp/alan-map-7-1/
          retention-days: 30
