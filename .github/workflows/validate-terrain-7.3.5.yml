name: Validate Alan Map 7.3.5 Terrain Reset

on:
  push:
    branches:
      - '7.3.5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout 7.3.5
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish validation run handle
        shell: bash
        run: |
          set -euo pipefail
          cat > data/validation-receipt-7.3.5.json <<EOF
          {
            "version": "7.3.5",
            "status": "running",
            "runId": ${{ github.run_id }},
            "testedCommit": "${{ github.sha }}",
            "artifact": "alan-map-7.3.5",
            "terrainArchitecture": "maplibre-native-single-source"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation-receipt-7.3.5.json
          git commit -m "Start 7.3.5 validation [skip ci]"
          git push origin HEAD:7.3.5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify terrain reset contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:data/alan-dem-7.3.5.pmtiles)" = "301dd6c9a415e67951f63846e4ea5bc253774c0d"
          test "$(stat -c%s data/alan-dem-7.3.5.pmtiles)" = "56681035"
          test ! -e data/alan-dem-7.3.3.pmtiles
          test ! -e assets/dem-lod-7.3.2.js
          test ! -e assets/dem-lod-7.3.3.js
          test ! -e assets/dem-lod-7.3.4.js
          ! grep -q "dem-lod-" assets/bootstrap.js
          ! grep -qE "terrain-dem-(medium|high)|SOURCE_(LOW|MEDIUM|HIGH)|desiredWithHysteresis|pendingSource|activeSource|SWITCH_HYSTERESIS" assets/bootstrap.js assets/terrain-reset-config-7.3.5.js
          ! grep -q "setTerrain" assets/terrain-reset-config-7.3.5.js
          grep -q "terrain-reset-config-7.3.5.js" assets/bootstrap.js
          grep -q "alan-dem-7.3.5.pmtiles" assets/terrain-reset-config-7.3.5.js
          node --check assets/bootstrap.js
          node --check assets/terrain-reset-config-7.3.5.js
          node --check tests/terrain-reset-7.3.5.mjs

      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate continuous native terrain
        run: node tests/terrain-reset-7.3.5.mjs

      - name: Publish successful runtime result
        shell: bash
        run: |
          set -euo pipefail
          cp build/terrain-reset-runtime-7.3.5.json data/terrain-reset-runtime-7.3.5.json
          cat > data/validation-receipt-7.3.5.json <<EOF
          {
            "version": "7.3.5",
            "status": "success",
            "runId": ${{ github.run_id }},
            "testedCommit": "${{ github.sha }}",
            "artifact": "alan-map-7.3.5",
            "terrainArchitecture": "maplibre-native-single-source"
          }
          EOF
          git add data/terrain-reset-runtime-7.3.5.json data/validation-receipt-7.3.5.json
          git commit -m "Publish 7.3.5 runtime result [skip ci]"
          git push origin HEAD:7.3.5

      - name: Package complete project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alan-map-7.3.5
          cp data/terrain-reset-runtime-7.3.5.json /tmp/alan-map-7.3.5/
          cp data/validation-receipt-7.3.5.json /tmp/alan-map-7.3.5/
          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            ! -path './build/*' \
            ! -name 'package.json' \
            ! -name 'package-lock.json' \
            -print0 | sort -z | while IFS= read -r -d '' file; do
              bytes=$(stat -c%s "$file")
              printf '%s\t%s\n' "${file#./}" "$bytes"
            done > /tmp/alan-map-7.3.5/file-sizes.tsv
          zip -qr /tmp/alan-map-7.3.5/alan-map-7.3.5.zip . \
            -x '.git/*' 'node_modules/*' 'build/*' 'package.json' 'package-lock.json'
          unzip -tq /tmp/alan-map-7.3.5/alan-map-7.3.5.zip
          sha256sum /tmp/alan-map-7.3.5/alan-map-7.3.5.zip > /tmp/alan-map-7.3.5/archive-sha256.txt

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: alan-map-7.3.5
          path: /tmp/alan-map-7.3.5/
          if-no-files-found: error
          retention-days: 30

      - name: Publish failure status
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cat > data/validation-receipt-7.3.5.json <<EOF
          {
            "version": "7.3.5",
            "status": "failure",
            "runId": ${{ github.run_id }},
            "testedCommit": "${{ github.sha }}",
            "artifact": "alan-map-7.3.5",
            "terrainArchitecture": "maplibre-native-single-source"
          }
          EOF
          git add data/validation-receipt-7.3.5.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish 7.3.5 validation failure [skip ci]"
          git push origin HEAD:7.3.5
