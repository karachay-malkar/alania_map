name: Probe Copernicus data access

on:
  push:
    branches: [7.0.24]
    paths:
      - '.github/workflows/probe-copernicus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Probe Copernicus DEM public COG
        run: |
          set -euxo pipefail
          TILE='Copernicus_DSM_COG_10_N43_00_E042_00_DEM'
          URL="https://copernicus-dem-30m.s3.eu-central-1.amazonaws.com/${TILE}/${TILE}.tif"
          curl --fail --location --retry 3 --range 0-1023 "$URL" -o /tmp/dem-head.bin
          test "$(stat -c%s /tmp/dem-head.bin)" -gt 0

      - name: Probe public CLMS EODATA mirrors
        run: |
          set -euxo pipefail
          python - <<'PY'
          import urllib.request, urllib.error
          products = [
              ('LCFM_LCM-10_V100_2020_N42E039_cog','LCFM_LCM-10_V100_2020_N42E039_MAP.tif'),
              ('LCFM_LCM-10_V100_2020_N42E042_cog','LCFM_LCM-10_V100_2020_N42E042_MAP.tif'),
          ]
          bases = [
              'https://s3.waw3-1.cloudferro.com/swift/v1/EODATA/CLMS/landcover_landuse/dynamic_land_cover/lcm_global_10m_yearly_v1/2020/01/01',
              'https://eodata.dataspace.copernicus.eu/CLMS/landcover_landuse/dynamic_land_cover/lcm_global_10m_yearly_v1/2020/01/01',
          ]
          ok=[]
          for folder,name in products:
              for base in bases:
                  for suffix in (f'{folder}/{name}', f'{folder}/{folder}/{name}'):
                      url=f'{base}/{suffix}'
                      req=urllib.request.Request(url, headers={'Range':'bytes=0-1023','User-Agent':'curl/8'})
                      try:
                          with urllib.request.urlopen(req, timeout=45) as r:
                              payload=r.read(1024)
                              print('OK', r.status, len(payload), r.geturl())
                              if payload: ok.append(url)
                      except urllib.error.HTTPError as exc:
                          print('HTTP', exc.code, url)
                      except Exception as exc:
                          print('ERR', type(exc).__name__, str(exc), url)
          print('SUCCESS_COUNT', len(ok))
          for url in ok: print('SUCCESS_URL', url)
          if len(ok) < 2:
              raise SystemExit('No anonymous full coverage for CLMS 10m')
          PY
