name: Probe Copernicus data access

on:
  push:
    branches: [7.0.24]
    paths:
      - '.github/workflows/probe-copernicus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
      CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
      SH_CLIENT_ID: ${{ secrets.SH_CLIENT_ID }}
      SH_CLIENT_SECRET: ${{ secrets.SH_CLIENT_SECRET }}
      COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
      COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Check credential presence only
        run: |
          python - <<'PY'
          import os
          pairs = [
              ('CDSE_CLIENT_ID','CDSE_CLIENT_SECRET'),
              ('SH_CLIENT_ID','SH_CLIENT_SECRET'),
              ('COPERNICUS_CLIENT_ID','COPERNICUS_CLIENT_SECRET'),
          ]
          available=[]
          for left,right in pairs:
              present=bool(os.environ.get(left)) and bool(os.environ.get(right))
              print(f'{left}/{right}:', 'configured' if present else 'not-configured')
              if present: available.append((left,right))
          print('CREDENTIAL_PAIR_COUNT', len(available))
          PY
