name: Probe Copernicus data access

on:
  push:
    branches: [7.0.24]
    paths:
      - '.github/workflows/probe-copernicus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Probe Copernicus DEM public COG
        run: |
          set -euxo pipefail
          TILE='Copernicus_DSM_COG_10_N43_00_E042_00_DEM'
          URL="https://copernicus-dem-30m.s3.eu-central-1.amazonaws.com/${TILE}/${TILE}.tif"
          curl --fail --location --retry 3 --range 0-1023 "$URL" -o /tmp/dem-head.bin
          test "$(stat -c%s /tmp/dem-head.bin)" -gt 0

      - name: Inspect CLMS product metadata for public services
        run: |
          set -euxo pipefail
          URL='https://sdi.eea.europa.eu/catalogue/srv/api/records/602507b2-96c7-47bb-b79d-7ba25e97d0a9/formatters/xml?approved=true'
          curl --fail --location --retry 3 "$URL" -o /tmp/lcm.xml
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/lcm.xml').read_text(encoding='utf-8', errors='replace')
          urls=sorted(set(re.findall(r'https?://[^<\s"&]+', text)))
          for url in urls:
              if any(key in url.lower() for key in ('wmts','wms','map','service','download','copernicus')):
                  print(url)
          print('URL_COUNT=', len(urls))
          PY

      - name: Probe likely WMTS capabilities links
        run: |
          set -euxo pipefail
          grep -Eio 'https?://[^<" ]+' /tmp/lcm.xml | sed 's/&amp;/\&/g' | grep -Ei 'wmts|wms|service' | sort -u | head -n 30 || true
