name: Optimize Alan Map 7.0.24 Copernicus DEM

on:
  push:
    branches: [7.0.24]
    paths:
      - '.github/workflows/optimize-copernicus-dem-7.0.24.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alan-map-7-0-24-dem-optimize
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install DEM and test tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin git zip
          python -m pip install --break-system-packages --upgrade pip
          python -m pip install --break-system-packages rasterio rio-rgbify
          go install github.com/protomaps/go-pmtiles@v1.30.1
          GO_BIN="$(go env GOPATH)/bin"
          ln -sf "$GO_BIN/go-pmtiles" "$GO_BIN/pmtiles"
          echo "$GO_BIN" >> "$GITHUB_PATH"

      - name: Reconstruct verified vector archive
        run: |
          set -euxo pipefail
          mkdir -p build
          cat data/shards/vector-7.0.24/part-*.bin > build/alan-vector-7.0.24.pmtiles
          pmtiles verify build/alan-vector-7.0.24.pmtiles
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path('data/copernicus-build-manifest.json').read_text(encoding='utf-8'))
          path=Path('build/alan-vector-7.0.24.pmtiles')
          h=hashlib.sha256(path.read_bytes()).hexdigest()
          assert path.stat().st_size == manifest['vector']['bytes'], (path.stat().st_size, manifest['vector']['bytes'])
          assert h == manifest['vector']['sha256'], (h, manifest['vector']['sha256'])
          print('vector archive reconstruction: ok')
          PY

      - name: Make z12 the canonical DEM ceiling
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          release=Path('tools/release_7_0_24.py')
          text=release.read_text(encoding='utf-8')
          old="'available':True,'archivePath':DEM_ARCHIVE,'minzoom':7,'maxzoom':13,'tileSize':256,"
          new="'available':True,'archivePath':DEM_ARCHIVE,'minzoom':7,'maxzoom':12,'tileSize':256,"
          if old in text:
              text=text.replace(old,new,1)
          if new not in text:
              raise SystemExit('Could not set regionalDem maxzoom=12')
          release.write_text(text,encoding='utf-8')
          PY

      - name: Build native-resolution Copernicus DEM GLO-30 Terrain-RGB
        run: |
          set -euxo pipefail
          mkdir -p build/copernicus-dem
          python - <<'PY'
          import json, math, pathlib, urllib.request
          bounds=json.loads(pathlib.Path('data/copernicus-build-manifest.json').read_text(encoding='utf-8'))['bounds']
          west,south,east,north=bounds
          out=pathlib.Path('build/copernicus-dem')
          for lat in range(math.floor(south), math.ceil(north)):
              for lon in range(math.floor(west), math.ceil(east)):
                  ns='N' if lat >= 0 else 'S'; ew='E' if lon >= 0 else 'W'
                  tile=f'Copernicus_DSM_COG_10_{ns}{abs(lat):02d}_00_{ew}{abs(lon):03d}_00_DEM'
                  url=f'https://copernicus-dem-30m.s3.eu-central-1.amazonaws.com/{tile}/{tile}.tif'
                  target=out/f'{tile}.tif'
                  request=urllib.request.Request(url,headers={'User-Agent':'AlanMap/7.0.24'})
                  print('download',url)
                  with urllib.request.urlopen(request,timeout=240) as response, target.open('wb') as f:
                      while True:
                          chunk=response.read(1024*1024)
                          if not chunk: break
                          f.write(chunk)
          PY
          read WEST SOUTH EAST NORTH < <(python - <<'PY'
          import json
          print(*json.load(open('data/copernicus-build-manifest.json'))['bounds'])
          PY
          )
          gdalbuildvrt build/copernicus-dem.vrt build/copernicus-dem/*.tif
          gdalwarp -overwrite -t_srs EPSG:4326 -te "$WEST" "$SOUTH" "$EAST" "$NORTH" -r bilinear \
            -of GTiff -co TILED=YES -co COMPRESS=DEFLATE -co BIGTIFF=IF_SAFER \
            build/copernicus-dem.vrt build/copernicus-dem-clipped.tif
          rio rgbify -b -10000 -i 0.1 --min-z 7 --max-z 12 -j 4 --format png \
            build/copernicus-dem-clipped.tif build/alan-dem-7.0.24.mbtiles
          pmtiles convert build/alan-dem-7.0.24.mbtiles build/alan-dem-7.0.24.pmtiles
          pmtiles verify build/alan-dem-7.0.24.pmtiles
          ls -lh build/alan-dem-7.0.24.pmtiles

      - name: Replace DEM shards and validate runtime
        run: |
          set -euxo pipefail
          python tools/release_7_0_24.py finalize \
            --dem build/alan-dem-7.0.24.pmtiles \
            --vector build/alan-vector-7.0.24.pmtiles
          rm -f data/alan-dem-7.0.24.pmtiles data/alan-vector-7.0.24.pmtiles
          python tools/release_7_0_24.py validate
          node tests/runtime-contract.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          text=(Path('assets/map-data.part-000.js').read_text(encoding='utf-8')+Path('assets/map-data.part-001.js').read_text(encoding='utf-8'))
          assert '"maxzoom":12' in text, 'runtime DEM maxzoom is not 12'
          manifest=json.loads(Path('data/copernicus-build-manifest.json').read_text(encoding='utf-8'))
          assert manifest['dem']['bytes'] < 536870912, manifest['dem']['bytes']
          print('optimized DEM bytes:',manifest['dem']['bytes'])
          PY

      - name: Browser smoke test
        run: |
          set -euxo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/map-smoke.mjs

      - name: Commit optimized 7.0.24 project
        run: |
          set -euxo pipefail
          git config user.name 'Alan Map Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Optimize Alan Map 7.0.24 Copernicus DEM to native z12'
            git push origin HEAD:7.0.24
          fi

      - name: Package full project and file sizes
        run: |
          set -euxo pipefail
          mkdir -p /tmp/alan-map-artifact
          find . -type f \
            -not -path './.git/*' -not -path './build/*' -not -path './node_modules/*' \
            -printf '%P\t%s\n' | sort > /tmp/alan-map-artifact/file-sizes-7.0.24.tsv
          zip -qr /tmp/alan-map-artifact/alan-map-7.0.24.zip . \
            -x '.git/*' 'build/*' 'node_modules/*'
          ls -lh /tmp/alan-map-artifact/alan-map-7.0.24.zip

      - uses: actions/upload-artifact@v4
        with:
          name: alan-map-7.0.24-optimized-full
          path: /tmp/alan-map-artifact/
          retention-days: 30
