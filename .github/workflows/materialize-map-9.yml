name: Materialize Alan Map 9.0

on:
  push:
    branches:
      - 9.0
    paths:
      - 'alan-map-9.0-materialize.zip'
      - '.github/workflows/materialize-map-9.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'alan-map-9.0-materialize.zip'
      - '.github/workflows/materialize-map-9.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-alan-map-9.0-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9.0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract complete version 9.0
        run: |
          test -f alan-map-9.0-materialize.zip
          unzip -o alan-map-9.0-materialize.zip -d .
          rm alan-map-9.0-materialize.zip

      - name: Validate runtime contract
        run: node tests/runtime-contract.mjs

      - name: Commit materialized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md index.html assets tests alan-map-9.0-materialize.zip
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release Alan Map 9.0 peak-anchored mountains"
            git push origin HEAD:9.0
          fi
