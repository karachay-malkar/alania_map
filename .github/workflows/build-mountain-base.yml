name: Inspect mountain source assets

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - staging/build.trigger
      - .github/workflows/build-mountain-base.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Inspect source assets and peak registry
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          OUTPUT = Path('data')
          OUTPUT.mkdir(exist_ok=True)

          def git(*args):
              return subprocess.check_output(['git', *args], text=True)

          def branch_tree(branch):
              return git('ls-tree', '-r', '--name-only', f'origin/{branch}').splitlines()

          def load_data(branch, names):
              paths = sorted(path for path in names if path.startswith('assets/map-data') and path.endswith('.js'))
              raw = ''.join(git('show', f'origin/{branch}:{path}') for path in paths)
              match = re.search(r'window\.ALAN_MAP_DATA\s*=\s*', raw)
              if not match:
                  raise RuntimeError(f'window.ALAN_MAP_DATA not found in {branch}')
              return json.loads(raw[match.end():].strip().rstrip(';'))

          asset_report = {}
          for branch in ('main', '7.0.23', '8.0', '9.0'):
              names = branch_tree(branch)
              data = load_data(branch, names)
              related = [
                  path for path in names
                  if any(word in path.lower() for word in ('mount', 'peak', 'ridge', 'terrain', 'dem', 'elev'))
              ]
              asset_report[branch] = {
                  'regionalDem': data.get('regionalDem'),
                  'regionalVector': data.get('regionalVector'),
                  'related_files': related,
                  'peaks_count': len((data.get('peaks') or {}).get('features') or []),
                  'highPeaks_count': len((data.get('highPeaks') or {}).get('features') or []),
                  'ridges_count': len((data.get('ridges') or {}).get('features') or []),
              }

          main_names = branch_tree('main')
          main_data = load_data('main', main_names)
          peaks = []
          for feature in (main_data.get('peaks') or {}).get('features') or []:
              props = feature.get('properties') or {}
              peaks.append({
                  'id': props.get('peak_id'),
                  'name': props.get('name_ru') or props.get('source_name') or '',
                  'coordinates': (feature.get('geometry') or {}).get('coordinates'),
                  'elevation_m': props.get('elevation_m'),
                  'label_tier': props.get('label_tier'),
              })

          (OUTPUT / 'source-assets.json').write_text(
              json.dumps(asset_report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          (OUTPUT / 'peaks-main-compact.json').write_text(
              json.dumps(peaks, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY

      - name: Commit compact asset inspection
        run: |
          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-assets.json data/peaks-main-compact.json
          git commit -m "Inspect DEM and mountain source assets [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"
