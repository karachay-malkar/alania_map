name: Build Alan Map 10.0 mountain base

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - tools/**
      - .github/workflows/build-mountain-base.yml
      - staging/build.trigger
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Restore authoritative source files
        run: |
          git checkout origin/main -- assets/map-data.part-000.js assets/map-data.part-001.js
          git checkout origin/7.0.23 -- data/shards-manifest.json data/shards/vector-7.0.23 data/shards/dem-7.0.21
          cat data/shards/vector-7.0.23/part-*.bin > /tmp/alan-vector-7.0.23.pmtiles
          cat data/shards/dem-7.0.21/part-*.bin > /tmp/alan-dem-7.0.21.pmtiles
          test "$(stat -c%s /tmp/alan-vector-7.0.23.pmtiles)" = "13956788"
          test "$(stat -c%s /tmp/alan-dem-7.0.21.pmtiles)" = "34261814"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned extraction dependencies
        run: npm install --no-save pmtiles@4.3.0 @mapbox/vector-tile@2.0.4 pbf@4.0.1 sharp@0.34.3

      - name: Extract peaks and sample real elevations
        run: node tools/extract-peaks.mjs /tmp/alan-vector-7.0.23.pmtiles /tmp/alan-dem-7.0.21.pmtiles /tmp/all-peaks.geojson

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate flat mountain base
        run: python tools/build_mountain_base.py /tmp/all-peaks.geojson

      - name: Finalize browser entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace(
              'src="assets/bootstrap.js"',
              'src="assets/bootstrap.js?v=10.0.1"',
          )
          index_path.write_text(index, encoding='utf-8')

          Path('assets/maplibre.css').write_text(
              '.maplibregl-map{font:12px/20px "Helvetica Neue",Arial,sans-serif;overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent}'
              '.maplibregl-canvas{left:0;position:absolute;top:0}'
              '.maplibregl-canvas-container.maplibregl-interactive{cursor:grab;user-select:none;-webkit-user-select:none}'
              '.maplibregl-canvas-container.maplibregl-interactive:active{cursor:grabbing}'
              '.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-top-left,.maplibregl-ctrl-top-right{pointer-events:none;position:absolute;z-index:2}'
              '.maplibregl-ctrl-top-left{left:0;top:0}.maplibregl-ctrl-top-right{right:0;top:0}'
              '.maplibregl-ctrl-bottom-left{bottom:0;left:0}.maplibregl-ctrl-bottom-right{bottom:0;right:0}'
              '.maplibregl-ctrl{clear:both;pointer-events:auto;transform:translate(0)}'
              '.maplibregl-ctrl-top-right .maplibregl-ctrl{float:right;margin:10px 10px 0 0}'
              '.maplibregl-ctrl-group{background:#fff;border-radius:4px;overflow:hidden}'
              '.maplibregl-ctrl-group button{background:transparent;border:0;box-sizing:border-box;cursor:pointer;display:block;height:29px;outline:none;padding:0;width:29px}'
              '.maplibregl-ctrl-group button+button{border-top:1px solid #ddd}'
              '.maplibregl-ctrl-icon{align-items:center;display:flex;height:100%;justify-content:center;width:100%}'
              '.maplibregl-ctrl-zoom-in .maplibregl-ctrl-icon:before{content:"+";font:26px/1 Arial,sans-serif}'
              '.maplibregl-ctrl-zoom-out .maplibregl-ctrl-icon:before{content:"−";font:26px/1 Arial,sans-serif}'
              '.maplibregl-ctrl-attrib{background:rgba(255,255,255,.7);margin:0;padding:0 5px}'
              '.maplibregl-ctrl-attrib a{color:inherit;text-decoration:none}',
              encoding='utf-8',
          )
          PY

      - name: Validate generated project
        run: |
          node --check assets/bootstrap.js
          node --check assets/map-ui.js
          node --check assets/map-page.js
          test -s assets/maplibre.css
          grep -q 'assets/bootstrap.js?v=10.0.1' index.html
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          validation = json.loads(Path('data/mountains/mountain_validation.json').read_text(encoding='utf-8'))
          assert validation['anchor_count'] >= 100
          assert validation['unnamed_anchor_count'] > 0
          assert validation['mount_1_present'] is False
          assert all(validation['checks'].values())

          with Path('data/mountains/mountain_points.csv').open(encoding='utf-8-sig', newline='') as handle:
              reader = csv.DictReader(handle)
              assert reader.fieldnames == ['id','latitude','longitude','elevation','name','category','ridge_id']
              rows = list(reader)

          assert len(rows) == validation['anchor_count']
          assert all(row['id'].split('-', 1)[0] in {'hill','mount','rock','peak'} for row in rows)
          assert all(row['category'] in {'regular','main'} for row in rows)

          manifest = json.loads(Path('data/mountains/mountain_icon_manifest.json').read_text(encoding='utf-8'))
          assert 'mount-1' in manifest['excluded']
          assert all(icon['id'] != 'mount-1' for icon in manifest['icons'])

          excluded = {
              'mountain_icon_manifest.json',
              'mountain_validation.json',
              'README.md',
              'DATA-SOURCES-AND-LICENSES.md',
          }
          candidates = [Path('index.html')]
          for suffix in ('*.js', '*.json', '*.csv', '*.geojson'):
              candidates.extend(Path('assets').rglob(suffix))
              candidates.extend(Path('data').rglob(suffix))

          forbidden = re.compile(r'(?<![A-Za-z0-9_-])mount-1(?![0-9])')
          violations = []
          for path in candidates:
              if path.name in excluded:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if forbidden.search(text):
                  violations.append(str(path))

          assert not violations, f"Forbidden mount-1 references: {violations}"
          PY

      - name: Record build metadata and file sizes
        run: |
          rm -rf node_modules package.json package-lock.json
          mkdir -p .build
          printf '%s\n' "${GITHUB_RUN_ID}" > .build/run-id.txt
          printf '%s\n' "${GITHUB_SHA}" > .build/source-commit.txt
          find . -type f ! -path './.git/*' ! -path './.build/file-sizes.txt' -printf '%P\t%s\n' | sort > .build/file-sizes.txt

      - name: Commit complete generated project
        run: |
          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Alan Map 10.0 mountain base [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Package complete project
        run: |
          zip -qr Alan_Map_10.0_mountain_base.zip . -x '.git/*' 'node_modules/*'
          sha256sum Alan_Map_10.0_mountain_base.zip > Alan_Map_10.0_mountain_base.sha256

      - name: Upload complete archive
        uses: actions/upload-artifact@v4
        with:
          name: Alan_Map_10.0_mountain_base
          path: |
            Alan_Map_10.0_mountain_base.zip
            Alan_Map_10.0_mountain_base.sha256
            .build/file-sizes.txt
          if-no-files-found: error
          retention-days: 30
