name: Inspect mountain source data

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - staging/build.trigger
      - .github/workflows/build-mountain-base.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Restore authoritative source data
        run: |
          git checkout origin/main -- assets/map-data.part-000.js assets/map-data.part-001.js

      - name: Inspect all geographic collections
        run: |
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          parts = sorted(Path('assets').glob('map-data.part-*.js'))
          raw = ''.join(path.read_text(encoding='utf-8') for path in parts)
          match = re.search(r'window\.ALAN_MAP_DATA\s*=\s*', raw)
          if not match:
              raise RuntimeError('window.ALAN_MAP_DATA assignment was not found')
          payload = raw[match.end():].strip().rstrip(';')
          data = json.loads(payload)

          report = {
              'top_level_keys': sorted(data.keys()),
              'top_level': {},
              'feature_collections': {},
              'mountain_related': {},
          }

          def short(value, limit=6):
              if isinstance(value, dict):
                  return {k: short(v, limit) for k, v in list(value.items())[:limit]}
              if isinstance(value, list):
                  return [short(v, limit) for v in value[:limit]]
              return value

          def inspect_feature_collection(path, collection):
              features = collection.get('features') or []
              geometry_types = Counter()
              coordinate_lengths = Counter()
              property_keys = Counter()
              samples = []
              for feature in features:
                  geometry = feature.get('geometry') or {}
                  props = feature.get('properties') or {}
                  geometry_types[str(geometry.get('type'))] += 1
                  coords = geometry.get('coordinates')
                  if isinstance(coords, list):
                      coordinate_lengths[str(len(coords))] += 1
                  property_keys.update(props.keys())
                  if len(samples) < 12:
                      samples.append({
                          'geometry': geometry,
                          'properties': props,
                      })
              report['feature_collections'][path] = {
                  'count': len(features),
                  'geometry_types': dict(geometry_types),
                  'coordinate_lengths': dict(coordinate_lengths),
                  'property_keys': sorted(property_keys),
                  'samples': samples,
              }

          def walk(value, path='root', depth=0):
              if depth > 5:
                  return
              path_lower = path.lower()
              if isinstance(value, dict):
                  if value.get('type') == 'FeatureCollection':
                      inspect_feature_collection(path, value)
                  if any(word in path_lower for word in ('mount', 'peak', 'ridge', 'summit', 'terrain', 'elev')):
                      report['mountain_related'][path] = short(value, 12)
                  for key, child in value.items():
                      walk(child, f'{path}.{key}', depth + 1)
              elif isinstance(value, list):
                  if any(word in path_lower for word in ('mount', 'peak', 'ridge', 'summit', 'terrain', 'elev')):
                      report['mountain_related'][path] = {
                          'count': len(value),
                          'sample': short(value, 12),
                      }
                  for index, child in enumerate(value[:20]):
                      walk(child, f'{path}[{index}]', depth + 1)

          for key, value in data.items():
              report['top_level'][key] = {
                  'type': type(value).__name__,
                  'count': len(value) if isinstance(value, (dict, list, str)) else None,
                  'sample': short(value, 4),
              }
          walk(data)

          Path('data').mkdir(exist_ok=True)
          Path('data/source-inspection.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          PY

      - name: Remove temporarily restored files
        run: rm -f assets/map-data.part-000.js assets/map-data.part-001.js

      - name: Commit inspection
        run: |
          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-inspection.json
          git commit -m "Inspect authoritative mountain sources [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"
