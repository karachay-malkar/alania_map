name: Build Alan Map 7.3.1 hierarchical 512px DEM

on:
  push:
    branches: [7.3.1]
    paths:
      - 'tools/build_dem_hierarchical_7_3_1.py'
      - 'tools/patch_dem_edge_collar_512.py'
      - 'tools/release_7_3_1_dem.py'
      - '.github/workflows/rebuild-dem-7.3.1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alan-map-7-3-1-hierarchical-dem
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install DEM build and validation tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin sqlite3 zip
          python -m pip install --break-system-packages --upgrade pip
          python -m pip install --break-system-packages rasterio pillow numpy shapely scipy pmtiles
          go install github.com/protomaps/go-pmtiles@v1.30.1
          GO_BIN="$(go env GOPATH)/bin"
          test -x "$GO_BIN/go-pmtiles"
          ln -sf "$GO_BIN/go-pmtiles" "$GO_BIN/pmtiles"
          echo "$GO_BIN" >> "$GITHUB_PATH"

      - name: Validate exact current 7.3.1 baseline
        run: |
          set -euxo pipefail
          python tools/release_7_3_1_dem.py prepare
          python - <<'PY'
          import json
          expected=[40.51784,42.734095,44.184003,44.534975]
          expected_ring=[[40.51784,43.41265],[43.731622,42.734095],[44.184003,43.85642],[40.970221,44.534975],[40.51784,43.41265]]
          bounds=json.load(open('build/rectangular-bounds.json'))['bounds']
          ring=json.load(open('build/map-frame.geojson'))['features'][0]['geometry']['coordinates'][0]
          if bounds != expected or ring != expected_ring:
              raise SystemExit(f'7.3.1 frame drifted: bounds={bounds}, ring={ring}')
          PY
          find data -maxdepth 1 -type f -name '*.pmtiles' ! -name 'alan-dem-7.3.pmtiles' -print0 \
            | sort -z | xargs -0 sha256sum > build/non-dem-pmtiles-before.sha256

      - name: Download Copernicus DEM GLO-30 source COGs
        run: |
          set -euxo pipefail
          mkdir -p build/copernicus-dem
          python - <<'PY'
          import json, math, pathlib, urllib.request
          west,south,east,north=json.load(open('build/rectangular-bounds.json'))['bounds']
          out=pathlib.Path('build/copernicus-dem')
          for lat in range(math.floor(south),math.ceil(north)):
              for lon in range(math.floor(west),math.ceil(east)):
                  ns='N' if lat >= 0 else 'S'
                  ew='E' if lon >= 0 else 'W'
                  tile=f'Copernicus_DSM_COG_10_{ns}{abs(lat):02d}_00_{ew}{abs(lon):03d}_00_DEM'
                  url=f'https://copernicus-dem-30m.s3.eu-central-1.amazonaws.com/{tile}/{tile}.tif'
                  target=out/f'{tile}.tif'
                  request=urllib.request.Request(url,headers={'User-Agent':'AlanMap/7.3.1'})
                  print('download',url)
                  with urllib.request.urlopen(request,timeout=240) as response,target.open('wb') as handle:
                      while True:
                          chunk=response.read(1024*1024)
                          if not chunk:
                              break
                          handle.write(chunk)
          PY

      - name: Warp DEM through unchanged rotated map frame
        run: |
          set -euxo pipefail
          read WEST SOUTH EAST NORTH < <(python - <<'PY'
          import json
          print(*json.load(open('build/rectangular-bounds.json'))['bounds'])
          PY
          )
          gdalbuildvrt build/copernicus-dem.vrt build/copernicus-dem/*.tif
          gdalwarp -overwrite \
            -t_srs EPSG:4326 \
            -te "$WEST" "$SOUTH" "$EAST" "$NORTH" \
            -cutline build/map-frame.geojson -crop_to_cutline \
            -dstnodata -10000 -r bilinear \
            -of GTiff -co TILED=YES -co COMPRESS=DEFLATE -co BIGTIFF=IF_SAFER \
            build/copernicus-dem.vrt build/copernicus-dem-7.3.1-cutline.tif
          gdalinfo -json build/copernicus-dem-7.3.1-cutline.tif > build/copernicus-dem-7.3.1-cutline.info.json

      - name: Build hierarchical z7-z10 512px DEM pyramid
        run: |
          set -euxo pipefail
          python tools/build_dem_hierarchical_7_3_1.py \
            --build-from-dem build/copernicus-dem-7.3.1-cutline.tif \
            --output build/alan-dem-7.3.1-clean.mbtiles \
            --frame build/map-frame.geojson \
            | tee build/dem-build-report-7.3.1.json
          python tools/build_dem_hierarchical_7_3_1.py \
            build/alan-dem-7.3.1-clean.mbtiles --frame build/map-frame.geojson --validate \
            | tee build/dem-validation-7.3.1.json
          pmtiles convert build/alan-dem-7.3.1-clean.mbtiles build/alan-dem-7.3.1-clean.pmtiles
          pmtiles verify build/alan-dem-7.3.1-clean.pmtiles
          python - <<'PY'
          import json
          report=json.load(open('build/dem-build-report-7.3.1.json'))
          expected={'7':442.574,'8':442.574,'9':221.287,'10':110.644}
          if report.get('tile_size') != 512:
              raise SystemExit(f"Unexpected tile size: {report.get('tile_size')}")
          if report.get('minzoom') != 7 or report.get('maxzoom') != 10:
              raise SystemExit(f"Unexpected zoom range: {report.get('minzoom')}..{report.get('maxzoom')}")
          if report.get('effective_ground_m_per_information_pixel_at_center') != expected:
              raise SystemExit(f"Unexpected effective LOD: {report.get('effective_ground_m_per_information_pixel_at_center')}")
          if '11' in report.get('per_zoom',{}):
              raise SystemExit('z11 unexpectedly exists in hierarchical DEM')
          PY

      - name: Restore hidden tapered DEM frame collar in 512px mode
        run: |
          set -euxo pipefail
          python tools/patch_dem_edge_collar_512.py \
            build/alan-dem-7.3.1-clean.pmtiles \
            build/alan-dem-7.3.1.pmtiles \
            --data-part build/map-data-7.3.1-dem-config.js \
            --collar-m 4500 \
            --safe-max-elevation-m 1000 \
            --cap-softness-m 120 \
            --inner-taper-m 900 \
            --outer-skirt-m 3200 \
            --technical-base-m -10000 \
            --relief-exaggeration 2.55 \
            --frame-top-m 4000 \
            --report build/dem-edge-collar-report-7.3.1.json
          pmtiles verify build/alan-dem-7.3.1.pmtiles
          python - <<'PY'
          import json
          report=json.load(open('build/dem-edge-collar-report-7.3.1.json'))
          if report.get('tile_size') != 512 or report.get('version') != '7.3.1-r1':
              raise SystemExit(f'Unexpected 512px collar contract: {report}')
          PY

      - name: Measure DEM reduction and LOD contract
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json, pathlib
          baseline=18_247_328
          final=pathlib.Path('build/alan-dem-7.3.1.pmtiles').stat().st_size
          clean=pathlib.Path('build/alan-dem-7.3.1-clean.pmtiles').stat().st_size
          build=json.load(open('build/dem-build-report-7.3.1.json'))
          collar=json.load(open('build/dem-edge-collar-report-7.3.1.json'))
          if final >= baseline:
              raise SystemExit(f'Hierarchical DEM was not reduced: {final} >= {baseline}')
          summary={
              'version':'7.3.1',
              'baseline_dem_bytes_7_3_1':baseline,
              'clean_dem_bytes_7_3_1':clean,
              'dem_bytes_7_3_1':final,
              'dem_reduction_bytes':baseline-final,
              'dem_reduction_fraction':1-final/baseline,
              'tile_size':512,
              'height_quantization_m':1,
              'native_zoom_range':'z7-z10',
              'overzoom_from':10,
              'lod_model':'hierarchical-z10-to-z8-z7-shared-512-overzoom',
              'effective_ground_m_per_information_pixel_at_center':{'7':442.574,'8':442.574,'9':221.287,'10':110.644},
              'build':build,
              'edge_collar':collar,
          }
          pathlib.Path('build/dem-size-summary-7.3.1.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps({k:summary[k] for k in ('baseline_dem_bytes_7_3_1','dem_bytes_7_3_1','dem_reduction_bytes','dem_reduction_fraction')},indent=2))
          PY
          ls -lh build/alan-dem-7.3.1-clean.pmtiles build/alan-dem-7.3.1.pmtiles

      - name: Integrate DEM only into current 7.3.1
        run: |
          set -euxo pipefail
          python tools/release_7_3_1_dem.py finalize \
            --dem build/alan-dem-7.3.1.pmtiles \
            --build-report build/dem-build-report-7.3.1.json \
            --validation-report build/dem-validation-7.3.1.json \
            --collar-report build/dem-edge-collar-report-7.3.1.json \
            --size-summary build/dem-size-summary-7.3.1.json
          find data -maxdepth 1 -type f -name '*.pmtiles' ! -name 'alan-dem-7.3.pmtiles' -print0 \
            | sort -z | xargs -0 sha256sum > build/non-dem-pmtiles-after.sha256
          diff -u build/non-dem-pmtiles-before.sha256 build/non-dem-pmtiles-after.sha256

      - name: Validate runtime, navigation state and data contract
        run: |
          set -euxo pipefail
          python tools/release_7_3_1_dem.py validate
          node tests/runtime-contract.mjs

      - name: Browser Range and visual smoke test
        run: |
          set -euxo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/map-smoke.mjs

      - name: Commit complete 7.3.1 DEM update
        run: |
          set -euxo pipefail
          git config user.name 'Alan Map Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Build hierarchical 512px DEM for 7.3.1 [skip ci]'
            git push origin HEAD:7.3.1
          fi

      - name: Package complete 7.3.1 project and file sizes
        run: |
          set -euxo pipefail
          mkdir -p /tmp/alan-map-7-3-1
          find . -type f \
            -not -path './.git/*' \
            -not -path './build/*' \
            -not -path './node_modules/*' \
            -not -path '*/__pycache__/*' \
            -printf '%P\t%s\n' | sort > /tmp/alan-map-7-3-1/file-sizes-7.3.1.tsv
          cp data/dem-size-summary-7.3.1.json /tmp/alan-map-7-3-1/dem-size-summary-7.3.1.json
          zip -qr /tmp/alan-map-7-3-1/alan-map-7.3.1.zip . \
            -x '.git/*' 'build/*' 'node_modules/*' '*/__pycache__/*'
          unzip -tq /tmp/alan-map-7-3-1/alan-map-7.3.1.zip
          ls -lh /tmp/alan-map-7-3-1/alan-map-7.3.1.zip
          wc -l /tmp/alan-map-7-3-1/file-sizes-7.3.1.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: alan-map-7.3.1-hierarchical-dem
          path: /tmp/alan-map-7-3-1/
          retention-days: 30
