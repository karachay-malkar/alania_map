name: Final rebuild 13.0 mountain render

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout 13.0
        uses: actions/checkout@v4
        with:
          ref: agent/13-0-north-down-morphology-atlas
          fetch-depth: 0

      - name: Fetch original morphology sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/m126 /tmp/t13
          mkdir -p /tmp/m126 /tmp/t13/dem /tmp/t13/result
          git fetch --no-tags --depth=1 origin agent/12.1.6-terrain-morphology-run:refs/remotes/origin/m126
          git archive refs/remotes/origin/m126 | tar -x -C /tmp/m126
          test -s /tmp/m126/data/mountains/mountain-render-12.1.5.geojson
          base64 -d /tmp/m126/tools/classify_terrain_morphology.py.gz.b64 | gzip -d > /tmp/t13/classifier.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/t13/classifier.py')
          s=p.read_text(encoding='utf-8')
          old='''if len(result) != 3797:\n        raise RuntimeError(f"Expected 3797 source points, got {len(result)}")'''
          new='''if not result:\n        raise RuntimeError("No source points loaded")'''
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Setup terrain stack
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install terrain dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 rasterio==1.4.3 shapely==2.1.1 pyproj==3.7.1

      - name: Download Copernicus GLO-30
        shell: bash
        run: |
          set -euo pipefail
          for lat in 42 43 44; do
            for lon in 40 41 42 43; do
              stem="Copernicus_DSM_COG_10_N$(printf '%02d' "$lat")_00_E$(printf '%03d' "$lon")_00_DEM"
              curl --fail --location --retry 5 --retry-delay 2 \
                --output "/tmp/t13/dem/${stem}.tif" \
                "https://copernicus-dem-30m.s3.amazonaws.com/${stem}/${stem}.tif"
            done
          done

      - name: Download OSM morphology evidence
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/t13/query.txt <<'EOF'
          [out:json][timeout:900][maxsize:1073741824];
          (nwr["natural"~"^(bare_rock|cliff|scree|rock|ridge|arete|peak|saddle)$"](42.80,40.60,44.25,43.80););
          out geom;
          EOF
          ok=0
          for endpoint in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.nchc.org.tw/api/interpreter; do
            if curl --fail --location --retry 1 --max-time 1200 --data-urlencode "data@/tmp/t13/query.txt" --output /tmp/t13/osm.json "$endpoint"; then ok=1; break; fi
          done
          test "$ok" -eq 1

      - name: Classify exact 1000 active positions
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/t13/classifier.py \
            --points /tmp/m126/data/mountains/mountain-render-12.1.5.geojson \
            --dem-dir /tmp/t13/dem \
            --osm /tmp/t13/osm.json \
            --output-dir /tmp/t13/result
          test "$(python - <<'PY'
          import csv
          with open('/tmp/t13/result/mountain_morphology_classification.csv',encoding='utf-8-sig') as f: print(sum(1 for _ in csv.DictReader(f)))
          PY
          )" = "1000"

      - name: Build and validate render
        shell: python
        run: |
          import base64,csv,gzip,hashlib,json
          from collections import Counter,defaultdict
          from pathlib import Path
          valid={'rounded_hill','rounded_mountain','steep_mountain','isolated_peak','massif','ridge','rocky_peak','rocky_ridge','plateau'}
          with open('/tmp/t13/result/mountain_morphology_classification.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          by_id={str(r['id']):str(r['morphology']).strip() for r in rows}
          assert len(by_id)==1000 and set(by_id.values())==valid
          base=json.loads(Path('/tmp/m126/data/mountains/mountain-render-12.1.5.geojson').read_text(encoding='utf-8'))
          specials=json.loads(Path('data/mountains/special-mountains-12.1.8.geojson').read_text(encoding='utf-8'))
          special={}
          for f in specials['features']:
              p=f.get('properties') or {}
              sid=str(p.get('point_id') or p.get('id') or f.get('id') or '')
              if sid: special[sid]=str(p.get('role') or p.get('type') or '')
          groups=defaultdict(list); special_count=0
          for f in base['features']:
              p=f.setdefault('properties',{})
              pid=str(p.get('point_id') or p.get('id') or f.get('id') or '')
              morph=by_id.get(pid)
              assert morph in valid, (pid,morph)
              p['morphology']=morph
              role=special.get(pid)
              if role in {'main_mountain','five_thousander','unique_mountain'}:
                  p['role']=role; p['type']=role; p['icon_id']=None; p['icon_variant']=None; special_count+=1
              else:
                  groups[morph].append((pid,f))
          assert len(base['features'])==1000
          ordinary=sum(map(len,groups.values()))
          assert special_count==25 and ordinary==975,(special_count,ordinary)
          assert set(groups)==valid
          variant_stats={}
          for morph,entries in groups.items():
              entries.sort(key=lambda x:(float(x[1]['properties']['latitude']),float(x[1]['properties']['longitude']),x[0]))
              counts=Counter()
              for i,(_,f) in enumerate(entries):
                  variant=i%4+1
                  f['properties']['icon_variant']=variant
                  f['properties']['icon_id']=f'{morph}_{variant:02d}'
                  counts[variant]+=1
              expected_variants=min(4,len(entries))
              assert len(counts)==expected_variants,(morph,counts)
              if len(counts)>1: assert max(counts.values())-min(counts.values())<=1,(morph,counts)
              variant_stats[morph]=dict(counts)
          base['version']='12.1.8'
          raw=json.dumps(base,ensure_ascii=False,separators=(',',':')).encode()
          encoded=base64.b64encode(gzip.compress(raw,compresslevel=9,mtime=0)).decode()
          decoded=json.loads(gzip.decompress(base64.b64decode(encoded,validate=True)))
          assert len(decoded['features'])==1000
          assert all((f.get('properties') or {}).get('morphology') in valid for f in decoded['features'])
          Path('data/mountains/mountain-render-12.1.8.geojson.gz.b64').write_text(encoded,encoding='utf-8')
          print('RENDER PASS ordinary=',ordinary,'special=',special_count)
          print('morphology=',{k:len(v) for k,v in sorted(groups.items())})
          print('variants=',variant_stats)
          print('base64_chars=',len(encoded),'sha256=',hashlib.sha256(encoded.encode()).hexdigest())

      - name: Commit render to 13.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mountains/mountain-render-12.1.8.geojson.gz.b64
          git diff --cached --quiet && { echo 'No change'; exit 1; }
          git commit -m 'Rebuild valid morphology render for Alan Map 13.0'
          git push origin HEAD:agent/13-0-north-down-morphology-atlas
