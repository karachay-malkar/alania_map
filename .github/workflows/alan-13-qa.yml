name: Alan Map 13.0 QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate 13.0 atlas and runtime contract
        shell: python
        run: |
          import base64, hashlib, json, re, struct
          from collections import Counter
          from pathlib import Path

          valid = {
              'rounded_hill', 'rounded_mountain', 'steep_mountain',
              'isolated_peak', 'massif', 'ridge', 'rocky_peak',
              'rocky_ridge', 'plateau'
          }

          manifest_path = Path('data/mountains/mountain-icon-manifest-13.0.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['version'] == '13.0'
          assert manifest['source'] == 'mountain_icons_final_9_categories(1).zip'
          assert len(manifest['icons']) == 36
          ids = [item['id'] for item in manifest['icons']]
          assert len(ids) == len(set(ids)) == 36
          by_category = Counter(item['category'] for item in manifest['icons'])
          assert set(by_category) == valid
          assert all(by_category[name] == 4 for name in valid)

          parts = []
          for path in manifest['atlas_parts']:
              file = Path(path)
              assert file.is_file(), f'missing atlas chunk: {path}'
              parts.append(file.read_text(encoding='utf-8').strip())
          png = base64.b64decode(''.join(parts), validate=True)
          assert png[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', png[16:24])
          assert (width, height) == (800, 1350), (width, height)
          digest = hashlib.sha256(png).hexdigest()
          assert digest == manifest['sha256_png'], (digest, manifest['sha256_png'])

          bootstrap = Path('assets/bootstrap-13.0.js').read_text(encoding='utf-8')
          adapter = Path('assets/atlas-part-adapter-13.0.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          active = bootstrap + '\n' + adapter + '\n' + manifest_path.read_text(encoding='utf-8')

          assert 'mountain-atlas-12.1.8.s80' not in active
          assert not re.search(r'\bmount-\d+\b', active)
          assert 'NORTH_DOWN_BEARING = 180' in bootstrap
          assert "SPECIAL_IDS = new Set(['mingi_tau'])" in bootstrap
          adapter_pos = index.find('assets/atlas-part-adapter-13.0.js')
          bootstrap_pos = index.find('assets/bootstrap-13.0.js')
          assert adapter_pos >= 0 and bootstrap_pos >= 0 and adapter_pos < bootstrap_pos

          print(json.dumps({
              'atlas_sha256': digest,
              'atlas_size': [width, height],
              'icons': len(ids),
              'categories': by_category,
              'adapter_before_bootstrap': True
          }, ensure_ascii=False, indent=2))

      - name: Check runtime syntax
        run: |
          node --check assets/atlas-part-adapter-13.0.js
          node --check assets/bootstrap-13.0.js

      - name: Run page in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/alan-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"

          diagnose_dom() {
            local file="$1"
            python3 - "$file" <<'PY'
          from pathlib import Path
          import re, sys
          dom = Path(sys.argv[1]).read_text(encoding='utf-8')
          def one(pattern):
              m = re.search(pattern, dom, re.S)
              return re.sub(r'<[^>]+>', '', m.group(1)).strip() if m else '<missing>'
          print('DOM status:', one(r'id="map-status"[^>]*>(.*?)</p>'))
          print('DOM loading:', one(r'class="loading-text"[^>]*>(.*?)</div>'))
          pos = dom.find('id="loading"')
          print('DOM loading tag:', dom[pos:dom.find('>', pos)+1] if pos >= 0 else '<missing>')
          PY
          }

          check_dom() {
            local file="$1"
            diagnose_dom "$file"
            echo '--- server requests ---'
            cat /tmp/alan-server.log || true
            echo '--- chrome stderr tail ---'
            tail -80 /tmp/chrome.stderr || true
            ! grep -q 'data-failed' "$file"
            ! grep -q 'Карта не загрузилась' "$file"
            ! grep -q "Failed to execute 'atob'" "$file"
            python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          dom = Path(sys.argv[1]).read_text(encoding='utf-8')
          pos = dom.find('id="loading"')
          assert pos >= 0, 'loading node missing'
          tag_end = dom.find('>', pos)
          tag = dom[pos:tag_end]
          assert 'hidden' in tag, f'map did not finish loading: {tag}'
          assert 'Alan Map · 13.0' in dom
          print(f'Headless page load PASS: {sys.argv[1]}')
          PY
          }

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-angle=swiftshader \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --window-size=1440,1000 \
            --virtual-time-budget=45000 \
            --dump-dom \
            http://127.0.0.1:8000/ > /tmp/alan13-desktop.html 2>/tmp/chrome.stderr
          check_dom /tmp/alan13-desktop.html

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-angle=swiftshader \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --window-size=412,915 \
            --virtual-time-budget=45000 \
            --dump-dom \
            http://127.0.0.1:8000/ > /tmp/alan13-mobile.html 2>/tmp/chrome-mobile.stderr
          check_dom /tmp/alan13-mobile.html

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-angle=swiftshader \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --window-size=1440,1000 \
            --virtual-time-budget=45000 \
            --screenshot=/tmp/alan-map-13-desktop.png \
            http://127.0.0.1:8000/

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-angle=swiftshader \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --window-size=412,915 \
            --virtual-time-budget=45000 \
            --screenshot=/tmp/alan-map-13-mobile.png \
            http://127.0.0.1:8000/

      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alan-map-13-visual-qa
          path: |
            /tmp/alan-map-13-desktop.png
            /tmp/alan-map-13-mobile.png
            /tmp/alan13-desktop.html
            /tmp/alan13-mobile.html
            /tmp/alan-server.log
            /tmp/chrome.stderr
            /tmp/chrome-mobile.stderr
          if-no-files-found: warn
