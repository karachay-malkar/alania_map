name: Apply Alan Map 7.0.25 r4 cleanup

on:
  push:
    branches: [7.0.25]
    paths:
      - '.github/workflows/apply-7.0.25-r4-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alan-map-7-0-25-r4-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete rays and corner ornament from source
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('assets/map-ui.js')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"\n  function settlementBeamCollections\(objects\) \{.*?\n  \}\n\n  function interpolatePoint", "\n  function interpolatePoint", s, count=1, flags=re.S)
          assert n == 1
          s,n=re.subn(r"\n    const chevrons = \[0\.10,0\.16,0\.22,0\.28\]\.map\(\(t,index\) => \{.*?\n    const compassCoordinates =", "\n    const compassCoordinates =", s, count=1, flags=re.S)
          assert n == 1
          s=s.replace("    return {polygon,edge,ornament,compass,tornEdge,compassCoordinates};", "    return {polygon,edge,compass,tornEdge,compassCoordinates};",1)
          s=s.replace('      <path data-role="parchment-ornament" fill="none" stroke="#68482f" stroke-width="1.5" stroke-opacity=".68" stroke-linecap="round" stroke-linejoin="round"/>\n','',1)
          s=s.replace("    const beams = settlementBeamCollections(data?.objects);\n",'',1)
          s=s.replace("        ['peakSnow', data.peakSnow],\n        ['settlementBeamHalo', beams.halo],\n        ['settlementBeamCore', beams.core]\n", "        ['peakSnow', data.peakSnow]\n",1)
          s=s.replace("      presentation:{regionalLabels,boundaries,beamCount:beams.count,parchment}\n", "      presentation:{regionalLabels,boundaries,parchment}\n",1)
          s,n=re.subn(r"\n      const settlementBeamLayers = \[\n.*?\n      \];\n\n      const pointLayers =", "\n      const pointLayers =", s, count=1, flags=re.S)
          assert n == 1
          s=s.replace("        ...lineLayers,\n        ...settlementBeamLayers,\n        ...pointLayers,", "        ...lineLayers,\n        ...pointLayers,",1)
          s,n=re.subn(r"\n      const ornamentPath = geometry\.ornament\.features\.map\(\(feature\) => projectedPath\(feature\.geometry\.coordinates,false\)\)\.filter\(Boolean\)\.join\(' '\);\n      parchmentOverlay\.querySelector\('\[data-role=\"parchment-ornament\"\]'\)\?\.setAttribute\('d',ornamentPath\);",'',s,count=1)
          assert n == 1
          s=s.replace("        settlementBeamCount:runtimeSources.presentation.beamCount,\n",'',1)
          s=s.replace("      settlementBeamCollections,\n",'',1)
          assert 'settlementBeam' not in s
          assert 'settlement-beam' not in s
          assert 'parchment-ornament' not in s
          p.write_text(s,encoding='utf-8')

          p=Path('assets/map-presentation.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("  const BEAM_LAYER_IDS = Object.freeze(['settlement-beam-halo', 'settlement-beam-core']);\n",'',1)
          s,n=re.subn(r"\n  function removeSettlementBeams\(map\) \{.*?\n  \}\n",'\n',s,count=1,flags=re.S)
          assert n == 1
          s=s.replace("      removeSettlementBeams(map);\n",'')
          s=s.replace("    removeSettlementBeams(map);\n",'')
          s=s.replace("    map.on?.('styledata', () => { removeSettlementBeams(map); queueUpdate(); });\n", "    map.on?.('styledata', queueUpdate);\n",1)
          s=s.replace("      beamLayersRemoved:() => BEAM_LAYER_IDS.every((layerId) => !map.getLayer?.(layerId)),\n",'',1)
          s=s.replace("      ornamentColor:ORNAMENT_COLOR,\n      beamLayerIds:BEAM_LAYER_IDS\n", "      ornamentColor:ORNAMENT_COLOR\n",1)
          assert 'settlement-beam' not in s
          p.write_text(s,encoding='utf-8')

          p=Path('tests/runtime-contract.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("assert.ok(runtimeSources.presentation.beamCount > 0);\nassert.ok(runtimeSources.polygons.features.some(feature => feature.properties?.alan_source === 'settlementBeamHalo'));\nassert.ok(runtimeSources.polygons.features.some(feature => feature.properties?.alan_source === 'settlementBeamCore'));\n", "assert.ok(!runtimeSources.polygons.features.some(feature => String(feature.properties?.alan_source || '').startsWith('settlementBeam')));\nassert.ok(!uiSource.includes('settlementBeam'));\nassert.ok(!uiSource.includes('settlement-beam'));\n",1)
          s=s.replace("assert.equal(parchment.ornament.features.length,5);\n", "assert.equal('ornament' in parchment,false);\n",1)
          s=s.replace("assert.match(uiSource, /id:'settlement-beam-halo'.*?maxzoom:OBJECT_PRESENTATION\\.currentSettlements\\.minZoom/s);\nassert.match(uiSource, /id:'settlement-beam-core'.*?fill-extrusion-height':10000/s);\n", "assert.ok(!uiSource.includes('parchment-ornament'));\n",1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/map-smoke.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("        beamLayersRemoved:window.ALAN_MAP_PRESENTATION_7025?.beamLayersRemoved?.(),\n",'',1)
          s=s.replace("  assert.equal(diagnostics.overlay.beamLayersRemoved,true);\n",'',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate runtime
        run: |
          set -euxo pipefail
          node --check assets/map-ui.js
          node --check assets/map-presentation.js
          node --check tests/map-smoke.mjs
          python tools/release_7_0_25.py validate
          node tests/runtime-contract.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/map-smoke.mjs

      - name: Commit final source cleanup
        run: |
          set -euxo pipefail
          rm -f .github/workflows/apply-7.0.25-r4-cleanup.yml
          git config user.name 'Alan Map Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Alan Map 7.0.25 r4 presentation [skip ci]'
          git push origin HEAD:7.0.25
