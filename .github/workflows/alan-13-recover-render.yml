name: Recover Alan Map 13 mountain render

on:
  push:
    branches:
      - agent/13-0-north-down-morphology-atlas

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout 13.0 branch
        uses: actions/checkout@v4
        with:
          ref: agent/13-0-north-down-morphology-atlas
          fetch-depth: 0

      - name: Fetch staged 12.1.8 source payload from PR 18
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pr18 /tmp/recovered
          mkdir -p /tmp/pr18 /tmp/recovered
          git fetch --no-tags --depth=1 origin refs/pull/18/head:refs/remotes/origin/pr18-head
          git archive refs/remotes/origin/pr18-head | tar -x -C /tmp/pr18
          mapfile -t parts < <(find /tmp/pr18/tools -maxdepth 1 -type f -name '.12.1.8-payload.part-*' | sort)
          echo "payload parts: ${#parts[@]}"
          test "${#parts[@]}" -ge 9
          cat "${parts[@]}" > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tgz || true

      - name: Recover complete 12.1.8 source files
        shell: python
        run: |
          import io, tarfile, zlib
          from pathlib import Path, PurePosixPath

          compressed = Path('/tmp/payload.tgz').read_bytes()
          inflater = zlib.decompressobj(16 + zlib.MAX_WBITS)
          tar_bytes = inflater.decompress(compressed)
          stream = io.BytesIO(tar_bytes)
          root = Path('/tmp/recovered')
          recovered = []
          try:
              archive = tarfile.open(fileobj=stream, mode='r:')
              while True:
                  try:
                      member = archive.next()
                  except (tarfile.ReadError, EOFError, OSError):
                      break
                  if member is None:
                      break
                  rel = PurePosixPath(member.name)
                  if rel.is_absolute() or '..' in rel.parts:
                      raise RuntimeError(member.name)
                  target = root / Path(*rel.parts)
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  if not member.isfile():
                      continue
                  try:
                      source = archive.extractfile(member)
                      data = source.read() if source else b''
                  except (tarfile.ReadError, EOFError, OSError):
                      break
                  if len(data) != member.size:
                      break
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  recovered.append(member.name)
          except tarfile.ReadError:
              pass

          required = [
              'src/config.js','src/data.js','src/map.js','src/app.js',
              'tools/build_stage_12_1_8.py',
              'assets/mountains/mountain-atlas-12.1.8.png',
              'tools/.12.1.8-active-morphology.json.gz'
          ]
          missing = [p for p in required if not (root / p).is_file() or (root / p).stat().st_size == 0]
          print('recovered complete files:', len(recovered))
          if missing:
              raise RuntimeError('Missing recovered files: ' + ', '.join(missing))

      - name: Build a clean 12.1.8 mountain render
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/recovered
          base64 -w0 assets/mountains/mountain-atlas-12.1.8.png > assets/mountains/mountain-atlas-12.1.8.b64
          mkdir -p data/mountains
          base64 -w0 tools/.12.1.8-active-morphology.json.gz > data/mountains/mountain-morphology-active-12.1.8.json.gz.b64
          rm -f tools/.12.1.8-active-morphology.json.gz
          python3 tools/build_stage_12_1_8.py

      - name: Strictly validate recovered render
        shell: python
        run: |
          import base64, gzip, json, re
          from pathlib import Path
          path = Path('/tmp/recovered/data/mountains/mountain-render-12.1.8.geojson.gz.b64')
          compact = ''.join(path.read_text(encoding='utf-8').split())
          assert len(compact) % 4 == 0, len(compact) % 4
          assert re.fullmatch(r'[A-Za-z0-9+/]*={0,2}', compact), 'non-Base64 characters'
          raw = base64.b64decode(compact, validate=True)
          data = json.loads(gzip.decompress(raw))
          assert data['type'] == 'FeatureCollection'
          features = data['features']
          assert len(features) == 1000, len(features)
          valid = {'rounded_hill','rounded_mountain','steep_mountain','isolated_peak','massif','ridge','rocky_peak','rocky_ridge','plateau'}
          invalid = []
          icon_count = 0
          for i, f in enumerate(features):
              p = f.get('properties') or {}
              morphology = str(p.get('morphology') or '')
              if morphology not in valid:
                  invalid.append((i, morphology))
              if p.get('icon_id'):
                  icon_count += 1
          assert not invalid, invalid[:20]
          assert icon_count > 0
          print('render PASS:', len(features), 'features; icon_id:', icon_count, 'base64 chars:', len(compact))

      - name: Install recovered render into 13.0 branch
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/recovered/data/mountains/mountain-render-12.1.8.geojson.gz.b64 data/mountains/mountain-render-12.1.8.geojson.gz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mountains/mountain-render-12.1.8.geojson.gz.b64
          if git diff --cached --quiet; then
            echo 'Recovered render already installed'
            exit 0
          fi
          git commit -m 'Restore complete 12.1.8 mountain render for 13.0'
          git push origin HEAD:agent/13-0-north-down-morphology-atlas
