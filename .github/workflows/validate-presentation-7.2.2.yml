name: Validate Alan Map 7.2.2 native map-scene presentation

on:
  push:
    branches: ['7.2.2']
    paths:
      - 'assets/bootstrap.js'
      - 'assets/map-presentation.js'
      - 'assets/map-presentation-r2.js'
      - 'index.html'
      - 'README.md'
      - 'tests/**'
      - '.github/workflows/validate-presentation-7.2.2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate 7.2 runtime contract
        run: node tests/runtime-contract.mjs

      - name: Validate native world-space presentation geometry
        run: node tests/presentation-world-space.mjs

      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate browser rendering, Range transport and presentation
        run: node tests/map-smoke.mjs

      - name: Package complete 7.2.2 project and file sizes
        run: |
          set -euxo pipefail
          mkdir -p /tmp/alan-map-7-2-2
          find . -type f \
            -not -path './.git/*' -not -path './node_modules/*' -not -path '*/__pycache__/*' \
            -printf '%P\t%s\n' | sort > /tmp/alan-map-7-2-2/file-sizes-7.2.2.tsv
          zip -qr /tmp/alan-map-7-2-2/alan-map-7.2.2.zip . \
            -x '.git/*' 'node_modules/*' '*/__pycache__/*'
          unzip -tq /tmp/alan-map-7-2-2/alan-map-7.2.2.zip
          ls -lh /tmp/alan-map-7-2-2/alan-map-7.2.2.zip

      - uses: actions/upload-artifact@v4
        with:
          name: alan-map-7.2.2-full
          path: /tmp/alan-map-7-2-2/
          retention-days: 30
