name: Slippy Map 1.0 QA package
on:
  pull_request:
    branches: [slippy-map]
permissions:
  contents: read
jobs:
  qa-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slippy-map
      - name: Validate source and canonical data
        run: |
          set -euo pipefail
          node --check src/config.js
          node --check src/data.js
          node --check src/map.js
          node --check src/main.js
          node tools/validate.mjs
          test -s vendor/maplibre-gl.js
          test -s data/map-boundary.geojson
          test -s data/mountains.geojson
          grep -q "bearing: 180" src/config.js
          grep -q "pitch: 25" src/config.js
          ! grep -R -E 'app-12|bootstrap-12|map-frame-12|mountain-render-12|part-[0-9]{3}\.bin|force-cache' index.html styles.css src
      - name: Browser diagnostic in Chrome
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/slippy-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} || true' EXIT
          mkdir -p /tmp/slippy-browser && cd /tmp/slippy-browser
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          cat > smoke.cjs <<'EOF'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME, args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader']});
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            const messages=[]; const errors=[]; const failed=[];
            page.on('console', m => messages.push(`${m.type()}: ${m.text()}`));
            page.on('pageerror', e => errors.push(String(e)));
            page.on('requestfailed', r => failed.push(`${r.url()} :: ${r.failure()?.errorText || ''}`));
            const response = await page.goto('http://127.0.0.1:4173', {waitUntil:'networkidle', timeout:30000});
            await page.waitForTimeout(3500);
            const diagnostic = {
              http: response?.status(),
              status: await page.locator('#status').innerText(),
              stats: await page.locator('#stats').innerText(),
              canvas: await page.locator('canvas').count(),
              maplibre: await page.evaluate(() => typeof maplibregl),
              messages, errors, failed,
              resources: await page.evaluate(() => performance.getEntriesByType('resource').map(e => e.name))
            };
            console.log(JSON.stringify(diagnostic, null, 2));
            await page.screenshot({path:process.env.GITHUB_WORKSPACE + '/browser-diagnostic.png'});
            await browser.close();
            if (!diagnostic.status.includes('Геометрия загружена')) process.exit(2);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          CHROME="$CHROME" node smoke.cjs
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slippy-map-browser-diagnostic
          path: browser-diagnostic.png
          retention-days: 14
          if-no-files-found: warn
