name: Build Slippy Map canonical data
on:
  pull_request:
    branches: [slippy-map]
permissions:
  contents: read
  actions: read
jobs:
  canonical-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified 12.1.6 morphology audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/morphology-outer /tmp/morphology-inner
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8939797200/zip" \
            -o /tmp/morphology-artifact.zip
          unzip -q /tmp/morphology-artifact.zip -d /tmp/morphology-outer
          unzip -q /tmp/morphology-outer/alan-map-terrain-morphology-audit.zip -d /tmp/morphology-inner
          test -f /tmp/morphology-inner/mountain_points_morphology.geojson
      - name: Build canonical Slippy Map data
        run: |
          set -euo pipefail
          python3 tools/extract_historical_data.py \
            --audit /tmp/morphology-inner/mountain_points_morphology.geojson \
            --boundary data/map-boundary.geojson \
            --output data/mountains.geojson \
            --report data/data-report.json
          node tools/validate.mjs
      - name: Upload canonical Slippy Map data
        uses: actions/upload-artifact@v4
        with:
          name: slippy-map-1.0-canonical-data
          path: |
            data/mountains.geojson
            data/data-report.json
          retention-days: 14
          if-no-files-found: error
