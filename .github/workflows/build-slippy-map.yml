name: Slippy Map 1.0 QA package
on:
  pull_request:
    branches: [slippy-map]
permissions:
  contents: read
jobs:
  qa-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slippy-map
      - name: Validate source and canonical data
        run: |
          set -euo pipefail
          node --check src/config.js
          node --check src/data.js
          node --check src/map.js
          node --check src/main.js
          node tools/validate.mjs
          test -s vendor/maplibre-gl.js
          test -s data/map-boundary.geojson
          test -s data/mountains.geojson
          ! grep -R -E 'app-12|bootstrap-12|map-frame-12|mountain-render-12|part-[0-9]{3}\.bin|force-cache' index.html styles.css src
      - name: Package exact branch runtime
        run: |
          set -euo pipefail
          mkdir -p build
          zip -9 -r build/slippy-map-1.0.zip \
            index.html styles.css README.md \
            src data vendor tools/validate.mjs \
            -x '*.DS_Store'
      - name: Upload QA package
        uses: actions/upload-artifact@v4
        with:
          name: slippy-map-1.0-qa-package
          path: build/slippy-map-1.0.zip
          retention-days: 14
          if-no-files-found: error
