name: Slippy Map 1.0 QA package
on:
  pull_request:
    branches: [slippy-map]
permissions:
  contents: read
jobs:
  qa-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slippy-map
      - name: Validate source and canonical data
        run: |
          set -euo pipefail
          node --check src/config.js
          node --check src/data.js
          node --check src/map.js
          node --check src/main.js
          node tools/validate.mjs
          test -s vendor/maplibre-gl.js
          test -s data/map-boundary.geojson
          test -s data/mountains.geojson
          grep -q "bearing: 180" src/config.js
          grep -q "pitch: 25" src/config.js
          ! grep -R -E 'app-12|bootstrap-12|map-frame-12|mountain-render-12|part-[0-9]{3}\.bin|force-cache' index.html styles.css src
      - name: Browser smoke test in Chrome
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/slippy-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} || true' EXIT
          mkdir -p /tmp/slippy-browser && cd /tmp/slippy-browser
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME"
          cat > smoke.cjs <<'EOF'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const crypto = require('crypto');
          const assert = (v, m) => { if (!v) throw new Error(m); };
          const hash = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          (async () => {
            const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME, args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader']});
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[]; const failed=[];
            page.on('console', m => { if (m.type()==='error') errors.push(m.text()); });
            page.on('pageerror', e => errors.push(String(e)));
            page.on('requestfailed', r => failed.push(`${r.url()} :: ${r.failure()?.errorText || ''}`));
            const response = await page.goto('http://127.0.0.1:4173', {waitUntil:'networkidle', timeout:30000});
            assert(response && response.ok(), 'HTTP page load failed');
            await page.waitForFunction(() => document.querySelector('#status')?.textContent.includes('Геометрия загружена'), null, {timeout:30000});
            assert(await page.locator('canvas').count() === 1, 'MapLibre canvas missing');
            const size = await page.locator('canvas').evaluate(c => ({w:c.clientWidth,h:c.clientHeight}));
            assert(size.w > 1000 && size.h > 700, `Canvas too small ${JSON.stringify(size)}`);
            const text = await page.locator('#stats').innerText();
            assert(text.includes('3798 точек'), 'Canonical point count not rendered');
            assert(text.includes('Минги') === false, 'Legend should remain category-only');
            const resources = await page.evaluate(() => performance.getEntriesByType('resource').map(e => e.name));
            assert(resources.every(u => !/12\.1|7\.0\.23|part-\d{3}\.bin|mountain-render/i.test(u)), `Old runtime request detected: ${resources.join('\n')}`);
            await page.screenshot({path:'/tmp/before.png'});
            await page.mouse.move(820,500); await page.mouse.wheel(0,-900); await page.waitForTimeout(700);
            await page.screenshot({path:'/tmp/after-zoom.png'});
            assert(hash('/tmp/before.png') !== hash('/tmp/after-zoom.png'), 'Zoom produced no visual change');
            await page.mouse.move(900,500); await page.mouse.down(); await page.mouse.move(740,570,{steps:12}); await page.mouse.up(); await page.waitForTimeout(500);
            await page.screenshot({path:'/tmp/after-drag.png'});
            assert(hash('/tmp/after-zoom.png') !== hash('/tmp/after-drag.png'), 'Drag produced no visual change');
            assert(errors.length === 0, `Browser errors: ${errors.join('\n')}`);
            assert(failed.length === 0, `Failed requests: ${failed.join('\n')}`);
            fs.copyFileSync('/tmp/after-drag.png', process.env.GITHUB_WORKSPACE + '/browser-qa.png');
            console.log(JSON.stringify({ok:true, canvas:size, resources, status:await page.locator('#status').innerText()}, null, 2));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          CHROME="$CHROME" node smoke.cjs
          cd "$GITHUB_WORKSPACE"
      - name: Package exact branch runtime
        run: |
          set -euo pipefail
          mkdir -p build
          zip -9 -r build/slippy-map-1.0.zip \
            index.html styles.css README.md \
            src data vendor tools/validate.mjs \
            -x '*.DS_Store'
      - name: Upload QA package
        uses: actions/upload-artifact@v4
        with:
          name: slippy-map-1.0-qa-package
          path: |
            build/slippy-map-1.0.zip
            browser-qa.png
          retention-days: 14
          if-no-files-found: error
