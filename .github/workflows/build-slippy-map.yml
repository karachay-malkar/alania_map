name: Build Slippy Map canonical data
on:
  pull_request:
    branches: [slippy-map]
permissions:
  contents: read
jobs:
  canonical-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original morphology classifier CLI
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/karachay-malkar/alania_map/agent/12.1.6-terrain-morphology-run/tools/classify_terrain_morphology.py.gz.b64' -o /tmp/classifier.b64
          base64 --decode /tmp/classifier.b64 | gzip --decompress > /tmp/classify_terrain_morphology.py
          grep -nE 'def main|ArgumentParser|add_argument|default=|write_text|open\(' /tmp/classify_terrain_morphology.py | tail -120
