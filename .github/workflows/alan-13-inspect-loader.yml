name: Alan Map 13 loader inspect

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compressed runtime resources
        shell: python
        run: |
          import base64, binascii, gzip, json
          from pathlib import Path

          files = [
              'data/mountains/mountain-render-12.1.8.geojson.gz.b64',
              'data/hydrography/rivers-12.1.5.geojson.gz.b64',
          ]
          for name in files:
              text = Path(name).read_text(encoding='utf-8')
              compact = ''.join(text.split())
              print(f'\n===== {name} =====')
              print('chars:', len(text), 'compact:', len(compact), 'mod4:', len(compact) % 4)
              print('prefix:', repr(compact[:32]), 'suffix:', repr(compact[-32:]))
              try:
                  payload = base64.b64decode(compact, validate=True)
                  print('base64: PASS bytes=', len(payload), 'gzip header=', payload[:10].hex())
              except Exception as e:
                  print('base64: FAIL', type(e).__name__, str(e))
                  continue
              try:
                  decoded = gzip.decompress(payload)
                  print('gzip: PASS bytes=', len(decoded))
              except Exception as e:
                  print('gzip: FAIL', type(e).__name__, str(e))
                  continue
              try:
                  obj = json.loads(decoded)
                  print('json: PASS type=', obj.get('type'), 'features=', len(obj.get('features', [])))
              except Exception as e:
                  print('json: FAIL', type(e).__name__, str(e))
