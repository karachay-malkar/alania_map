name: Alan Map 13 loader inspect

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect core compressed-resource loader
        shell: python
        run: |
          import base64, gzip
          from pathlib import Path
          raw = ''.join(Path('assets/app-12.1.8.js.gz.b64').read_text(encoding='utf-8').split())
          code = gzip.decompress(base64.b64decode(raw, validate=True)).decode('utf-8')
          needles = ['atob(', 'DecompressionStream', '.gz.b64', 'mountainRenderUrl', 'iconManifestUrl', 'riversUrl', 'fetch(']
          for needle in needles:
              print(f'\n===== {needle} =====')
              start = 0
              count = 0
              while True:
                  pos = code.find(needle, start)
                  if pos < 0: break
                  count += 1
                  print(f'--- occurrence {count} at {pos} ---')
                  print(code[max(0,pos-1200):min(len(code),pos+2200)])
                  start = pos + len(needle)
                  if count >= 12: break
              if count == 0: print('<none>')
