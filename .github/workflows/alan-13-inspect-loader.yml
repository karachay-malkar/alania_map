name: Alan Map 13 loader inspect

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strictly validate every requested Base64 resource
        shell: python
        run: |
          import base64, gzip, hashlib, json
          from pathlib import Path

          resources = [
              ('app', Path('assets/app-12.1.8.js.gz.b64'), True, False),
              ('mountain-render', Path('data/mountains/mountain-render-12.1.8.geojson.gz.b64'), True, True),
              ('rivers', Path('data/hydrography/rivers-12.1.5.geojson.gz.b64'), True, True),
          ]

          for label, path, is_gzip, is_json in resources:
              compact = ''.join(path.read_text(encoding='utf-8').split())
              print(f'\n{label}: chars={len(compact)} mod4={len(compact)%4} sha256_text={hashlib.sha256(compact.encode()).hexdigest()}')
              try:
                  raw = base64.b64decode(compact, validate=True)
                  print(f'  base64 PASS bytes={len(raw)} prefix={raw[:12].hex()}')
              except Exception as e:
                  print(f'  base64 FAIL {type(e).__name__}: {e}')
                  raise
              if is_gzip:
                  try:
                      raw = gzip.decompress(raw)
                      print(f'  gzip PASS bytes={len(raw)}')
                  except Exception as e:
                      print(f'  gzip FAIL {type(e).__name__}: {e}')
                      raise
              if is_json:
                  obj = json.loads(raw)
                  feats = obj.get('features', [])
                  keys = sorted({k for f in feats[:100] for k in (f.get('properties') or {})})
                  print(f'  json PASS type={obj.get("type")} features={len(feats)} keys={keys}')
                  if label == 'mountain-render':
                      assert len(feats) == 1000, len(feats)
                      morph = sorted({str((f.get('properties') or {}).get('morphology','')) for f in feats})
                      icons = sum(bool((f.get('properties') or {}).get('icon_id')) for f in feats)
                      print(f'  mountain morphology={morph} icon_id_count={icons}')

          manifest = json.loads(Path('data/mountains/mountain-icon-manifest-13.0.json').read_text(encoding='utf-8'))
          atlas_text = ''.join(Path(p).read_text(encoding='utf-8').strip() for p in manifest['atlas_parts'])
          atlas = base64.b64decode(atlas_text, validate=True)
          print(f'\natlas: base64 PASS bytes={len(atlas)} png={atlas[:8].hex()} sha256={hashlib.sha256(atlas).hexdigest()}')
          assert atlas[:8] == b'\x89PNG\r\n\x1a\n'
          assert hashlib.sha256(atlas).hexdigest() == manifest['sha256_png']
