name: Alan Map 13 loader inspect

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect available mountain source data
        shell: bash
        run: |
          set -euo pipefail
          echo '=== data/mountains ==='
          find data/mountains -maxdepth 2 -type f -printf '%p | %s bytes\n' | sort
          echo '=== other mountain-like data ==='
          find data -type f \( -iname '*mount*' -o -iname '*peak*' -o -iname '*ridge*' -o -iname '*terrain*' \) -printf '%p | %s bytes\n' | sort
      - name: Validate candidate GeoJSON and compressed files
        shell: python
        run: |
          import base64, gzip, json
          from pathlib import Path

          for path in sorted(Path('data').rglob('*')):
              if not path.is_file():
                  continue
              name = str(path)
              if not any(token in path.name.lower() for token in ('mount', 'ridge', 'peak', 'terrain')):
                  continue
              if path.suffix == '.geojson':
                  try:
                      obj = json.loads(path.read_text(encoding='utf-8'))
                      feats = obj.get('features', []) if isinstance(obj, dict) else []
                      props = (feats[0].get('properties') or {}) if feats else {}
                      print(f'GEOJSON PASS {name}: features={len(feats)} sample_props={sorted(props)[:30]}')
                  except Exception as e:
                      print(f'GEOJSON FAIL {name}: {type(e).__name__}: {e}')
              elif name.endswith('.gz.b64'):
                  text = path.read_text(encoding='utf-8')
                  compact = ''.join(text.split())
                  print(f'B64 {name}: chars={len(compact)} mod4={len(compact)%4} suffix={compact[-40:]!r}')
                  try:
                      payload = base64.b64decode(compact, validate=True)
                      decoded = gzip.decompress(payload)
                      obj = json.loads(decoded)
                      feats = obj.get('features', []) if isinstance(obj, dict) else []
                      props = (feats[0].get('properties') or {}) if feats else {}
                      print(f'  PASS features={len(feats)} decoded={len(decoded)} sample_props={sorted(props)[:30]}')
                  except Exception as e:
                      print(f'  FAIL {type(e).__name__}: {e}')
