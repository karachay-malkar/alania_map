name: Alan Map 13 loader inspect

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch previous morphology branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin agent/12.1.6-terrain-morphology-run:refs/remotes/origin/agent/12.1.6-terrain-morphology-run
          rm -rf /tmp/morph126
          mkdir -p /tmp/morph126
          git archive origin/agent/12.1.6-terrain-morphology-run | tar -x -C /tmp/morph126
      - name: Inspect previous mountain source data
        shell: bash
        run: |
          set -euo pipefail
          echo '=== candidate files in 12.1.6 morphology branch ==='
          find /tmp/morph126 -type f \( -iname '*mount*' -o -iname '*peak*' -o -iname '*ridge*' -o -iname '*terrain*' -o -iname '*morph*' \) -printf '%P | %s bytes\n' | sort
      - name: Validate previous candidate data
        shell: python
        run: |
          import base64, gzip, json
          from pathlib import Path
          root = Path('/tmp/morph126')
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              low = path.name.lower()
              if not any(token in low for token in ('mount','ridge','peak','terrain','morph')):
                  continue
              rel = path.relative_to(root)
              if path.suffix == '.geojson':
                  try:
                      obj = json.loads(path.read_text(encoding='utf-8'))
                      feats = obj.get('features', []) if isinstance(obj, dict) else []
                      keys = sorted({k for f in feats[:50] for k in (f.get('properties') or {})})
                      print(f'GEOJSON {rel}: features={len(feats)} keys={keys}')
                      if feats:
                          print(' sample=', json.dumps(feats[0].get('properties') or {}, ensure_ascii=False)[:1200])
                  except Exception as e:
                      print(f'GEOJSON FAIL {rel}: {type(e).__name__}: {e}')
              elif str(path).endswith('.gz.b64'):
                  try:
                      compact = ''.join(path.read_text(encoding='utf-8').split())
                      payload = base64.b64decode(compact, validate=True)
                      decoded = gzip.decompress(payload)
                      obj = json.loads(decoded)
                      feats = obj.get('features', []) if isinstance(obj, dict) else []
                      keys = sorted({k for f in feats[:50] for k in (f.get('properties') or {})})
                      print(f'B64 {rel}: PASS features={len(feats)} keys={keys}')
                      if feats:
                          print(' sample=', json.dumps(feats[0].get('properties') or {}, ensure_ascii=False)[:1200])
                  except Exception as e:
                      print(f'B64 FAIL {rel}: {type(e).__name__}: {e}')
