name: Build Alan Map 7.3 generalized DEM geometry

on:
  push:
    branches: [7.3]
    paths:
      - 'tools/release_7_3.py'
      - '.github/workflows/rebuild-map-7.3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alan-map-7-3-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install DEM build and validation tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin sqlite3 zip
          python -m pip install --break-system-packages --upgrade pip
          python -m pip install --break-system-packages rasterio pillow numpy shapely scipy pmtiles
          go install github.com/protomaps/go-pmtiles@v1.30.1
          GO_BIN="$(go env GOPATH)/bin"
          test -x "$GO_BIN/go-pmtiles"
          ln -sf "$GO_BIN/go-pmtiles" "$GO_BIN/pmtiles"
          echo "$GO_BIN" >> "$GITHUB_PATH"

      - name: Validate exact 7.2.5 baseline and prepare 7.3 frame
        run: |
          set -euxo pipefail
          python tools/release_7_3.py prepare
          python - <<'PY'
          import json
          expected=[40.51784,42.734095,44.184003,44.534975]
          expected_ring=[[40.51784,43.41265],[43.731622,42.734095],[44.184003,43.85642],[40.970221,44.534975],[40.51784,43.41265]]
          bounds=json.load(open('build/rectangular-bounds.json'))['bounds']
          ring=json.load(open('build/map-frame.geojson'))['features'][0]['geometry']['coordinates'][0]
          if bounds != expected or ring != expected_ring:
              raise SystemExit(f'7.3 frame drifted: bounds={bounds}, ring={ring}')
          PY

      - name: Download Copernicus DEM GLO-30 source COGs
        run: |
          set -euxo pipefail
          mkdir -p build/copernicus-dem
          python - <<'PY'
          import json, math, pathlib, urllib.request
          west,south,east,north=json.load(open('build/rectangular-bounds.json'))['bounds']
          out=pathlib.Path('build/copernicus-dem')
          for lat in range(math.floor(south),math.ceil(north)):
              for lon in range(math.floor(west),math.ceil(east)):
                  ns='N' if lat >= 0 else 'S'
                  ew='E' if lon >= 0 else 'W'
                  tile=f'Copernicus_DSM_COG_10_{ns}{abs(lat):02d}_00_{ew}{abs(lon):03d}_00_DEM'
                  url=f'https://copernicus-dem-30m.s3.eu-central-1.amazonaws.com/{tile}/{tile}.tif'
                  target=out/f'{tile}.tif'
                  request=urllib.request.Request(url,headers={'User-Agent':'AlanMap/7.3'})
                  print('download',url)
                  with urllib.request.urlopen(request,timeout=240) as response,target.open('wb') as handle:
                      while True:
                          chunk=response.read(1024*1024)
                          if not chunk:
                              break
                          handle.write(chunk)
          PY

      - name: Warp DEM through unchanged rotated map frame
        run: |
          set -euxo pipefail
          read WEST SOUTH EAST NORTH < <(python - <<'PY'
          import json
          print(*json.load(open('build/rectangular-bounds.json'))['bounds'])
          PY
          )
          gdalbuildvrt build/copernicus-dem.vrt build/copernicus-dem/*.tif
          gdalwarp -overwrite \
            -t_srs EPSG:4326 \
            -te "$WEST" "$SOUTH" "$EAST" "$NORTH" \
            -cutline build/map-frame.geojson -crop_to_cutline \
            -dstnodata -10000 -r bilinear \
            -of GTiff -co TILED=YES -co COMPRESS=DEFLATE -co BIGTIFF=IF_SAFER \
            build/copernicus-dem.vrt build/copernicus-dem-7.3-cutline.tif
          gdalinfo -json build/copernicus-dem-7.3-cutline.tif > build/copernicus-dem-7.3-cutline.info.json

      - name: Build generalized z7-z11 1 m DEM pyramid
        run: |
          set -euxo pipefail
          python tools/build_dem_lod_7_2.py \
            --build-from-dem build/copernicus-dem-7.3-cutline.tif \
            --output build/alan-dem-7.3-clean.mbtiles \
            --frame build/map-frame.geojson --minzoom 7 --maxzoom 11 \
            | tee build/dem-build-report-7.3.json
          python tools/build_dem_lod_7_2.py \
            build/alan-dem-7.3-clean.mbtiles --frame build/map-frame.geojson --validate \
            | tee build/dem-validation-7.3.json
          pmtiles convert build/alan-dem-7.3-clean.mbtiles build/alan-dem-7.3-clean.pmtiles
          pmtiles verify build/alan-dem-7.3-clean.pmtiles
          python - <<'PY'
          import json
          report=json.load(open('build/dem-build-report-7.3.json'))
          if report.get('minzoom') != 7 or report.get('maxzoom') != 11:
              raise SystemExit(f'Unexpected 7.3 DEM zoom range: {report.get("minzoom")}..{report.get("maxzoom")}')
          if report.get('height_quantization_m') != 1.0:
              raise SystemExit('7.3 height quantization changed')
          if '12' in report.get('per_zoom',{}):
              raise SystemExit('z12 unexpectedly exists in 7.3 DEM')
          print('clean encoded bytes:',report.get('encoded_png_bytes'))
          PY

      - name: Restore hidden tapered DEM frame collar at z7-z11
        run: |
          set -euxo pipefail
          python tools/patch_dem_edge_collar.py \
            build/alan-dem-7.3-clean.pmtiles \
            build/alan-dem-7.3.pmtiles \
            --data-part build/map-data-7.3-dem-config.js \
            --collar-m 4500 \
            --safe-max-elevation-m 1000 \
            --cap-softness-m 120 \
            --inner-taper-m 900 \
            --outer-skirt-m 3200 \
            --technical-base-m -10000 \
            --relief-exaggeration 2.55 \
            --frame-top-m 4000 \
            --report build/dem-edge-collar-report-7.3.json
          pmtiles verify build/alan-dem-7.3.pmtiles

      - name: Measure geometry reduction
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json, pathlib
          baseline=56_681_035
          final=pathlib.Path('build/alan-dem-7.3.pmtiles').stat().st_size
          clean=pathlib.Path('build/alan-dem-7.3-clean.pmtiles').stat().st_size
          build=json.load(open('build/dem-build-report-7.3.json'))
          collar=json.load(open('build/dem-edge-collar-report-7.3.json'))
          if final >= baseline:
              raise SystemExit(f'7.3 DEM was not reduced: {final} >= {baseline}')
          summary={
              'version':'7.3',
              'baseline_dem_bytes_7_2_5':baseline,
              'clean_dem_bytes_7_3':clean,
              'dem_bytes_7_3':final,
              'dem_reduction_bytes':baseline-final,
              'dem_reduction_fraction':1-final/baseline,
              'height_quantization_m':1,
              'native_zoom_range':'z7-z11',
              'previous_native_zoom_range':'z7-z12',
              'highest_native_zoom_removed':12,
              'overzoom_from':11,
              'geometry_generalization':'drop-z12-bilinear-downsample',
              'approx_ground_m_per_pixel_at_center_z11':55.322,
              'previous_approx_ground_m_per_pixel_at_center_z12':27.661,
              'build':build,
              'edge_collar':collar,
          }
          pathlib.Path('build/dem-size-summary-7.3.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps({k:summary[k] for k in ('baseline_dem_bytes_7_2_5','dem_bytes_7_3','dem_reduction_bytes','dem_reduction_fraction')},indent=2))
          PY
          ls -lh build/alan-dem-7.3-clean.pmtiles build/alan-dem-7.3.pmtiles

      - name: Integrate 7.3 while preserving vector and snow payloads
        run: |
          set -euxo pipefail
          VECTOR_SHA_BEFORE="$(sha256sum data/alan-vector-7.2.pmtiles | awk '{print $1}')"
          PERM_SHA_BEFORE="$(sha256sum data/alan-snow-permanent-7.2.5.pmtiles | awk '{print $1}')"
          SEASON_SHA_BEFORE="$(sha256sum data/alan-snow-seasonal-7.2.5.pmtiles | awk '{print $1}')"
          python tools/release_7_3.py finalize \
            --dem build/alan-dem-7.3.pmtiles \
            --build-report build/dem-build-report-7.3.json \
            --validation-report build/dem-validation-7.3.json \
            --collar-report build/dem-edge-collar-report-7.3.json \
            --size-summary build/dem-size-summary-7.3.json
          test "$VECTOR_SHA_BEFORE" = "$(sha256sum data/alan-vector-7.2.pmtiles | awk '{print $1}')"
          test "$PERM_SHA_BEFORE" = "$(sha256sum data/alan-snow-permanent-7.2.5.pmtiles | awk '{print $1}')"
          test "$SEASON_SHA_BEFORE" = "$(sha256sum data/alan-snow-seasonal-7.2.5.pmtiles | awk '{print $1}')"
          test ! -e data/alan-dem-7.2.pmtiles
          test -e data/alan-dem-7.3.pmtiles

      - name: Validate runtime, state migration, and data contract
        run: |
          set -euxo pipefail
          python tools/release_7_3.py validate
          node tests/runtime-contract.mjs

      - name: Browser Range and visual smoke test
        run: |
          set -euxo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/map-smoke.mjs

      - name: Commit complete 7.3 project
        run: |
          set -euxo pipefail
          git config user.name 'Alan Map Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Build Alan Map 7.3 generalized DEM geometry [skip ci]'
            git push origin HEAD:7.3
          fi

      - name: Package complete 7.3 project and file sizes
        run: |
          set -euxo pipefail
          mkdir -p /tmp/alan-map-7-3
          find . -type f \
            -not -path './.git/*' \
            -not -path './build/*' \
            -not -path './node_modules/*' \
            -not -path '*/__pycache__/*' \
            -printf '%P\t%s\n' | sort > /tmp/alan-map-7-3/file-sizes-7.3.tsv
          cp data/dem-size-summary-7.3.json /tmp/alan-map-7-3/dem-size-summary-7.3.json
          zip -qr /tmp/alan-map-7-3/alan-map-7.3.zip . \
            -x '.git/*' 'build/*' 'node_modules/*' '*/__pycache__/*'
          unzip -tq /tmp/alan-map-7-3/alan-map-7.3.zip
          ls -lh /tmp/alan-map-7-3/alan-map-7.3.zip
          wc -l /tmp/alan-map-7-3/file-sizes-7.3.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: alan-map-7.3-full
          path: /tmp/alan-map-7-3/
          retention-days: 30
