name: Install prepared Alan Map 12.1.8 payload

on:
  push:
    branches:
      - agent/12.1.8-morphology-gold-points

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Run 12.1.8 payload bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/12.1.8-morphology-gold-points
          fetch-depth: 0

      - name: Install prepared source payload
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/.12.1.8-payload.ready
          test "$(find tools -maxdepth 1 -name '.12.1.8-payload.part-*' | wc -l)" -ge 2
          cat $(find tools -maxdepth 1 -name '.12.1.8-payload.part-*' | sort) | base64 -d > /tmp/alan-map-12.1.8-source.tgz
          tar -tzf /tmp/alan-map-12.1.8-source.tgz >/dev/null
          tar -xzf /tmp/alan-map-12.1.8-source.tgz -C .
          base64 -w0 assets/mountains/mountain-atlas-12.1.8.png > assets/mountains/mountain-atlas-12.1.8.b64
          base64 -w0 tools/.12.1.8-active-morphology.json.gz > data/mountains/mountain-morphology-active-12.1.8.json.gz.b64
          rm -f tools/.12.1.8-active-morphology.json.gz

      - name: Generate and validate 12.1.8
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_stage_12_1_8.py
          node --check src/config.js
          node --check src/data.js
          node --check src/map.js
          node --check src/app.js
          node --check assets/app-12.1.8.js
          python3 -m py_compile tools/build_stage_12_1_8.py
          node tests/12.1-contract.mjs

      - name: Commit complete 12.1.8
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-12.1.8-from-prepared-12.1.7.yml
          rm -f tools/.12.1.8-payload.part-* tools/.12.1.8-payload.ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Alan Map 12.1.8: morphology icons and gold special mountains"
          git push origin HEAD:agent/12.1.8-morphology-gold-points
