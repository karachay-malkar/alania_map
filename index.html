<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#d8c8a8">
  <title>Alan Map 12.1.4 — горные цепи и речные ущелья</title>
  <link rel="stylesheet" href="assets/maplibre.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="map-shell" class="map-shell">
    <div id="map" class="map" aria-label="Плоская интерактивная карта горных фигурок и рек"></div>

    <div class="topbar">
      <section class="title-card" aria-label="Информация о карте">
        <h1 class="map-title">Alan Map · 12.1</h1>
        <p class="map-subtitle">Плоская Slippy Map · 1000 фигурок · 32 речные системы</p>
        <p id="map-status" class="map-status" role="status" aria-live="polite">Загрузка данных…</p>
      </section>
      <nav class="map-controls" aria-label="Управление масштабом">
        <button type="button" data-action="zoom-in" aria-label="Приблизить">+</button>
        <button type="button" data-action="zoom-out" aria-label="Отдалить">−</button>
        <button type="button" data-action="reset" aria-label="Показать всю территорию">⌂</button>
      </nav>
    </div>

    <section class="legend" aria-label="Категории горных объектов">
      <div class="legend-title"><span>Фигурки</span><span data-total-icons>0</span></div>
      <div class="legend-grid">
        <div class="legend-item"><span class="legend-dot" style="--dot:#7a7a78"></span><span>Горы</span><span class="legend-count" data-count="mountain">0</span></div>
        <div class="legend-item"><span class="legend-dot" style="--dot:#7a7a78"></span><span>Скалы</span><span class="legend-count" data-count="rock">0</span></div>
        <div class="legend-item"><span class="legend-dot" style="--dot:#7a7a78"></span><span>Хребты</span><span class="legend-count" data-count="ridge">0</span></div>
        <div class="legend-item"><span class="legend-dot" style="--dot:#7a7a78"></span><span>Холмы</span><span class="legend-count" data-count="hill">0</span></div>
        <div class="legend-item"><span class="legend-dot" style="--dot:#59483b"></span><span>Основные</span><span class="legend-count" data-count="main_mountain">0</span></div>
        <div class="legend-item"><span class="legend-dot" style="--dot:#342f2c"></span><span>5000+</span><span class="legend-count" data-count="five_thousander">0</span></div>
      </div>
    </section>

    <div id="loading" class="loading" role="status" aria-live="polite">
      <div class="loading-card">
        <div class="loading-title">Alan Map 12.1</div>
        <div class="loading-text">Подготавливаются 1000 фигурок и локальные речные коридоры.</div>
      </div>
    </div>
  </main>
  <script src="assets/bootstrap.js?v=12.1.4"></script>
</body>
</html>
